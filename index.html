              <div className="mt-10 flex justify-center pb-4">
                 <button onClick={() => setShowTutorial(false)} className="px-8 py-4 bg-red-600 hover:bg-red-500 text-white rounded-full font-bold text-lg sm:text-xl shadow-lg shadow-red-500/50 transition-colors">
                    閉じて冒険の準備をする
                 </button>
              </div>
            </div>
          </div>
        )}

        {/* データ引き継ぎモーダル */}
        {showTransferMenu && (
          <div className="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-4 sm:p-8 backdrop-blur-sm">
            <div className="bg-slate-800 border-2 border-slate-600 rounded-xl p-6 sm:p-8 flex flex-col gap-6 shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between items-center border-b border-slate-600 pb-2">
                <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2"><span>💾</span> データ引継ぎ</h2>
                <button onClick={() => setShowTransferMenu(false)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded font-bold border border-slate-500 text-sm">閉じる</button>
              </div>

              {transferMessage && (
                <div className="bg-slate-900 text-yellow-400 p-3 rounded text-center text-sm font-bold border border-yellow-600">
                  {transferMessage}
                </div>
              )}

              <div className="flex flex-col gap-2 bg-slate-900 p-4 rounded-lg border border-slate-700">
                <h3 className="text-lg font-bold text-sky-300">📦 データをコードとして書き出し (エクスポート)</h3>
                <p className="text-xs sm:text-sm text-slate-400 mb-2">現在の図鑑の解放状況と、ゲームのセーブデータを合体して文字コード化します。</p>
                <button onClick={handleExport} className="py-2 bg-sky-700 hover:bg-sky-600 text-white font-bold rounded-lg transition-colors border border-sky-500 shadow-lg">
                  コードを生成する
                </button>
                {transferOutput && (
                  <textarea 
                    readOnly 
                    value={transferOutput} 
                    onClick={(e) => e.target.select()}
                    className="w-full h-24 bg-slate-950 text-slate-300 text-xs p-3 rounded border border-slate-600 focus:outline-none focus:border-sky-500 mt-2 resize-none cursor-text font-mono"
                    placeholder="ここにコードが表示されます..."
                  />
                )}
              </div>

              <div className="flex flex-col gap-2 bg-slate-900 p-4 rounded-lg border border-slate-700">
                <h3 className="text-lg font-bold text-green-400">📥 コードからデータを復元 (インポート)</h3>
                <p className="text-xs sm:text-sm text-slate-400 mb-2">保存したコードを貼り付けて復元します。<span className="text-red-400 font-bold">※現在のデータは上書きされます！</span></p>
                <textarea 
                  value={transferInput}
                  onChange={(e) => setTransferInput(e.target.value)}
                  className="w-full h-24 bg-slate-950 text-white text-xs p-3 rounded border border-slate-600 focus:outline-none focus:border-green-500 resize-none font-mono"
                  placeholder="ここにコードを貼り付けてください..."
                />
                <button onClick={handleImport} className="py-2 bg-green-700 hover:bg-green-600 text-white font-bold rounded-lg transition-colors border border-green-500 shadow-lg mt-2">
                  コードを読み込んで復元
                </button>
              </div>

              <div className="flex flex-col gap-2 bg-red-900/20 p-4 rounded-lg border border-red-800/50 mt-2">
                <h3 className="text-lg font-bold text-red-500 flex items-center gap-2"><span>⚠️</span> 全データ初期化</h3>
                <p className="text-xs sm:text-sm text-slate-400 mb-2">セーブデータ、図鑑の解放状況、実績をすべて完全に消去します。</p>
                <button onClick={() => setDeleteStep(1)} className="py-2 bg-red-800 hover:bg-red-700 text-white font-bold rounded-lg transition-colors border border-red-600 shadow-lg">
                  データを完全に削除する
                </button>
              </div>
            </div>
          </div>
        )}

        {/* データ削除警告モーダル */}
        {deleteStep > 0 && (
          <div className="absolute inset-0 bg-slate-900/95 z-[60] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <div className="bg-slate-800 border-2 border-red-600 rounded-xl p-6 sm:p-8 flex flex-col gap-6 shadow-[0_0_30px_rgba(220,38,38,0.3)] w-full max-w-md text-center">
              <div className="text-5xl mb-2 animate-bounce">⚠️</div>
              <h2 className="text-xl sm:text-2xl font-bold text-red-500">データ削除の確認 ({deleteStep}/5)</h2>
              <p className="text-sm sm:text-base text-slate-300 font-bold leading-relaxed">
                {deleteWarnings[deleteStep]}
              </p>
              <div className="flex flex-col gap-3 mt-4">
                <button onClick={handleDeleteData} className="w-full py-3 bg-red-800 hover:bg-red-700 text-white font-bold rounded-lg transition-colors border border-red-500 shadow-lg">
                  はい、削除します
                </button>
                <button onClick={cancelDelete} className="w-full py-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-lg transition-colors border border-slate-400 shadow-lg">
                  いいえ、やめます
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ★ 新規追加: 実績画面
  if (state.screen === 'ACHIEVEMENTS') {
    const unlockedAchievements = state.unlocks?.achievements || [];
    return (
      <div className="h-screen w-full overflow-y-auto bg-slate-900 text-white flex flex-col items-center p-4 sm:p-8">
        <div className="flex flex-wrap justify-between w-full max-w-4xl mb-6 items-center border-b border-slate-700 pb-4 gap-4">
          <h1 className="text-2xl sm:text-4xl font-bold flex items-center gap-3"><span>🏆</span> 実績</h1>
          <button onClick={() => setState(p => ({ ...p, screen: 'TITLE' }))} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold border border-slate-500 text-sm sm:text-base">
            戻る
          </button>
        </div>

        <div className="w-full max-w-4xl flex flex-col gap-4 pb-8">
          {Object.values(ACHIEVEMENTS_DB).map(ach => {
            const isUnlocked = unlockedAchievements.includes(ach.id);
            
            return (
              <div key={ach.id} className={`flex items-center gap-4 sm:gap-6 p-4 sm:p-6 rounded-xl border-2 transition-all ${isUnlocked ? 'bg-slate-800 border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.2)]' : 'bg-slate-900/50 border-slate-700 opacity-70 grayscale'}`}>
                <div className={`text-4xl sm:text-5xl shrink-0 flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 ${isUnlocked ? 'bg-slate-900 border-yellow-500' : 'bg-slate-800 border-slate-600 text-slate-600'}`}>
                  {isUnlocked ? ach.icon : '🔒'}
                </div>
                <div className="flex flex-col flex-1">
                  <h3 className={`text-xl sm:text-2xl font-bold mb-1 ${isUnlocked ? 'text-yellow-400' : 'text-slate-400'}`}>
                    {isUnlocked || !ach.secret ? ach.name : '？？？'}
                  </h3>
                  <p className={`text-sm sm:text-base ${isUnlocked ? 'text-slate-300' : 'text-slate-500'}`}>
                    {isUnlocked || !ach.secret ? ach.desc : '条件は秘密にされている...'}
                  </p>
                </div>
                {isUnlocked && <div className="text-yellow-400 font-bold text-sm sm:text-base whitespace-nowrap bg-yellow-900/50 px-3 py-1 rounded-full border border-yellow-600">達成済</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ★ 新規追加: 図鑑メニュー
  if (state.screen === 'COMPENDIUM_MENU') {
    const getCollectionRate = (type, db) => {
      const unlocked = state.unlocks?.[type]?.length || 0;
      const total = Array.isArray(db) ? db.length : Object.keys(db).length;
      return { unlocked, total, rate: total > 0 ? Math.floor((unlocked / total) * 100) : 0 };
    };

    const cardRate = getCollectionRate('cards', CARD_DB);
    const enemyRate = getCollectionRate('enemies', ENEMY_DB);
    const relicRate = getCollectionRate('relics', RELICS_DB);
    const eventRate = getCollectionRate('events', EVENTS);

    return (
      <div className="h-screen w-full overflow-y-auto bg-slate-900 text-white flex flex-col items-center justify-center p-4 sm:p-8">
        <h1 className="text-3xl sm:text-5xl font-bold mb-8 text-center">図鑑メニュー</h1>
        
        {/* 図鑑達成率パネル */}
        <div className="bg-slate-800 border-2 border-slate-600 rounded-xl p-4 sm:p-6 shadow-lg text-sm sm:text-base text-slate-300 flex flex-col gap-2 sm:gap-3 mb-8 w-full max-w-md">
          <div className="font-bold text-white border-b border-slate-600 pb-2 mb-2 text-center text-lg">全体の図鑑収集率</div>
          <div className="flex justify-between gap-4 items-center"><span>🎴 カード:</span> <span className="font-mono text-white bg-slate-900 px-2 py-1 rounded">{cardRate.unlocked}/{cardRate.total} ({cardRate.rate}%)</span></div>
          <div className="flex justify-between gap-4 items-center"><span>👾 敵:</span> <span className="font-mono text-white bg-slate-900 px-2 py-1 rounded">{enemyRate.unlocked}/{enemyRate.total} ({enemyRate.rate}%)</span></div>
          <div className="flex justify-between gap-4 items-center"><span>🎁 レリック:</span> <span className="font-mono text-white bg-slate-900 px-2 py-1 rounded">{relicRate.unlocked}/{relicRate.total} ({relicRate.rate}%)</span></div>
          <div className="flex justify-between gap-4 items-center"><span>📜 イベント:</span> <span className="font-mono text-white bg-slate-900 px-2 py-1 rounded">{eventRate.unlocked}/{eventRate.total} ({eventRate.rate}%)</span></div>
        </div>

        <div className="flex flex-col gap-3 sm:gap-4 w-full max-w-md">
          <button onClick={() => setState(p => ({ ...p, screen: 'COMPENDIUM' }))} className="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold border-2 border-slate-600 flex items-center gap-4 transition-colors text-lg sm:text-xl">
            <span className="text-3xl">🎴</span> カード図鑑
          </button>
          <button onClick={() => setState(p => ({ ...p, screen: 'ENEMY_DEX' }))} className="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold border-2 border-slate-600 flex items-center gap-4 transition-colors text-lg sm:text-xl">
            <span className="text-3xl">👾</span> 敵図鑑
          </button>
          <button onClick={() => setState(p => ({ ...p, screen: 'RELIC_DEX' }))} className="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold border-2 border-slate-600 flex items-center gap-4 transition-colors text-lg sm:text-xl">
            <span className="text-3xl">🎁</span> レリック図鑑
          </button>
          <button onClick={() => setState(p => ({ ...p, screen: 'EVENT_DEX' }))} className="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold border-2 border-slate-600 flex items-center gap-4 transition-colors text-lg sm:text-xl">
            <span className="text-3xl">📜</span> イベント図鑑
          </button>
          <button onClick={() => setState(p => ({ ...p, screen: 'TITLE' }))} className="mt-4 p-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold border border-slate-500 transition-colors text-center text-sm sm:text-base">
            タイトルへ戻る
          </button>
        </div>
      </div>
    );
  }

  if (state.screen === 'COMPENDIUM') {
    const toggleUpgrade = (cardId) => {
      setUpgradedView(prev => ({ ...prev, [cardId]: !prev[cardId] }));
    };

    let displayCards = [];
    if (compendiumTab === 'CURSE') {
      displayCards = Object.values(CARD_DB).filter(c => c.type === 'CURSE').map(c => c.id);
    } else {
      displayCards = CHARACTERS[compendiumTab].cardPool;
    }

    const rarityOrder = { 'BASIC': 0, 'COMMON': 1, 'UNCOMMON': 2, 'RARE': 3 };
    const typeOrder = { 'ATTACK': 0, 'SKILL': 1, 'POWER': 2 };

    const sortedCards = [...displayCards].sort((a, b) => {
      const cardA = CARD_DB[a];
      const cardB = CARD_DB[b];
      if (typeOrder[cardA.type] !== typeOrder[cardB.type]) return typeOrder[cardA.type] - typeOrder[cardB.type];
      if (rarityOrder[cardA.rarity] !== rarityOrder[cardB.rarity]) return rarityOrder[cardA.rarity] - rarityOrder[cardB.rarity];
      return cardA.name.localeCompare(cardB.name, 'ja');
    });

    const groupedCards = {
      'ATTACK': sortedCards.filter(id => CARD_DB[id].type === 'ATTACK'),
      'SKILL': sortedCards.filter(id => CARD_DB[id].type === 'SKILL'),
      'POWER': sortedCards.filter(id => CARD_DB[id].type === 'POWER')
    };

    return (
      <div className="h-screen w-full overflow-y-auto bg-slate-900 text-white flex flex-col items-center p-4 sm:p-8">
        <div className="flex flex-wrap justify-between w-full max-w-6xl mb-6 items-center border-b border-slate-700 pb-4 gap-4">
          <h1 className="text-2xl sm:text-4xl font-bold flex items-center gap-3"><span>📖</span> カード図鑑</h1>
          <button onClick={() => setState(p => ({ ...p, screen: 'COMPENDIUM_MENU' }))} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold border border-slate-500 text-sm sm:text-base">
            戻る
          </button>
        </div>

        <div className="flex flex-wrap justify-center gap-2 sm:gap-4 mb-6 w-full max-w-6xl">
          {Object.values(CHARACTERS).map(char => (
            <button key={char.id} onClick={() => setCompendiumTab(char.id)} 
              className={`px-4 py-2 sm:px-6 sm:py-3 rounded-lg font-bold flex items-center gap-2 border-2 transition-colors text-sm sm:text-base
              ${compendiumTab === char.id ? 'bg-slate-800 border-yellow-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
              <span>{char.icon}</span> {char.name}
            </button>
          ))}
          <button onClick={() => setCompendiumTab('CURSE')} 
            className={`px-4 py-2 sm:px-6 sm:py-3 rounded-lg font-bold flex items-center gap-2 border-2 transition-colors text-sm sm:text-base
            ${compendiumTab === 'CURSE' ? 'bg-slate-800 border-purple-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
            <span>👻</span> 呪い
          </button>
        </div>

        {compendiumTab !== 'CURSE' && (
          <p className="text-slate-400 mb-6 text-xs sm:text-sm text-center">カードをタップするとアップグレード版に切り替わります</p>
        )}

        {compendiumTab === 'CURSE' ? (
          <div className="flex flex-wrap gap-4 justify-center max-w-6xl pb-8">
            {displayCards.map(cardId => {
              const isUnlocked = state.unlocks && state.unlocks.cards && state.unlocks.cards.includes(cardId);
              if (!isUnlocked) {
                return (
                  <div key={cardId} className="relative shrink-0 w-28 h-40 sm:w-32 sm:h-44 lg:w-36 lg:h-48 rounded-lg border-2 border-slate-700 bg-slate-800 p-1 sm:p-2 flex flex-col items-center justify-center shadow-lg opacity-60">
                     <div className="text-4xl opacity-30">❓</div>
                     <div className="text-slate-400 font-bold mt-4 text-xs sm:text-sm">未発見</div>
                  </div>
                );
              }
              const baseCard = CARD_DB[cardId];
              const isUpgraded = upgradedView[cardId] || false;
              const displayCard = { ...baseCard, upgraded: isUpgraded };
              return renderCard(displayCard, null, false, true, toggleUpgrade);
            })}
          </div>
        ) : (
          <div className="w-full max-w-6xl pb-8 flex flex-col gap-8">
            {['ATTACK', 'SKILL', 'POWER'].map(type => {
              const cards = groupedCards[type] || [];
              if (cards.length === 0) return null;
              return (
                <div key={type} className="w-full">
                  <h2 className="text-xl sm:text-2xl font-bold mb-4 border-b border-slate-700 pb-2 flex items-center gap-2">
                    <span>{renderIcon(type)}</span>
                    {type === 'ATTACK' ? 'アタック' : type === 'SKILL' ? 'スキル' : 'パワー'}
                  </h2>
                  <div className="flex flex-wrap gap-4 justify-start">
                    {cards.map(cardId => {
                      const isUnlocked = state.unlocks && state.unlocks.cards && state.unlocks.cards.includes(cardId);
                      if (!isUnlocked) {
                        return (
                          <div key={cardId} className="relative shrink-0 w-28 h-40 sm:w-32 sm:h-44 lg:w-36 lg:h-48 rounded-lg border-2 border-slate-700 bg-slate-800 p-1 sm:p-2 flex flex-col items-center justify-center shadow-lg opacity-60">
                             <div className="text-4xl opacity-30">❓</div>
                             <div className="text-slate-400 font-bold mt-4 text-xs sm:text-sm">未発見</div>
                          </div>
                        );
                      }
                      const baseCard = CARD_DB[cardId];
                      const isUpgraded = upgradedView[cardId] || false;
                      const displayCard = { ...baseCard, upgraded: isUpgraded };
                      return renderCard(displayCard, null, false, true, toggleUpgrade);
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  if (state.screen === 'ENEMY_DEX') {
    return (
      <div className="h-screen w-full overflow-y-auto bg-slate-900 text-white flex flex-col items-center p-4 sm:p-8">
        <div className="flex flex-wrap justify-between w-full max-w-6xl mb-6 items-center border-b border-slate-700 pb-4 gap-4">
          <h1 className="text-2xl sm:text-4xl font-bold flex items-center gap-3"><span>👾</span> 敵図鑑</h1>
          <button onClick={() => setState(p => ({ ...p, screen: 'COMPENDIUM_MENU' }))} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold border border-slate-500 text-sm sm:text-base">
            戻る
          </button>
        </div>

        <div className="flex flex-wrap gap-6 justify-center max-w-6xl pb-8">
          {Object.entries(ENEMY_DB).map(([id, enemy]) => {
            const isUnlocked = state.unlocks && state.unlocks.enemies && state.unlocks.enemies.includes(id);

            if (!isUnlocked) {
              return (
                <div key={id} className="w-64 bg-slate-800 border-2 border-slate-700 rounded-xl p-4 flex flex-col items-center shadow-lg relative shrink-0 opacity-50 grayscale">
                  <div className="text-6xl mb-4 mt-4 drop-shadow-md">❓</div>
                  <h3 className="text-xl font-bold text-slate-500 mb-2 text-center">未知の敵</h3>
                  <div className="w-full text-center bg-slate-900/50 p-4 rounded-lg flex-1 flex items-center justify-center border border-slate-700/50">
                    <p className="text-sm text-slate-500 leading-relaxed font-medium">まだ遭遇していないモンスター</p>
                  </div>
                </div>
              );
            }

            return (
              <div key={id} className="w-64 bg-slate-800 border-2 border-slate-600 rounded-xl p-4 flex flex-col items-center shadow-lg relative shrink-0">
                {enemy.isBoss && <div className="absolute top-2 right-2 text-xs font-bold bg-red-600 px-2 py-1 rounded text-white shadow">BOSS</div>}
                {enemy.isElite && <div className="absolute top-2 right-2 text-xs font-bold bg-purple-600 px-2 py-1 rounded text-white shadow">ELITE</div>}
                
                <div className="text-6xl mb-4 mt-4 drop-shadow-md">{enemy.isBoss ? '👹' : enemy.isElite ? '👿' : (id === 'thief' ? '🥷' : '👾')}</div>
                <h3 className="text-xl font-bold text-white mb-2 text-center">{enemy.name}</h3>
                <div className="text-red-400 font-bold mb-4 bg-slate-900 px-3 py-1 rounded-full text-sm">❤️ HP: {enemy.hp}</div>
                
                <div className="w-full text-center bg-slate-900/50 p-4 rounded-lg flex-1 flex items-center justify-center border border-slate-700/50">
                  <p className="text-sm text-slate-300 leading-relaxed font-medium">{enemy.desc}</p>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (state.screen === 'RELIC_DEX') {
    const relicGroups = {
      COMMON: [],
      UNCOMMON: [],
      RARE: [],
      EVENT: []
    };

    Object.entries(RELICS_DB).forEach(([id, relic]) => {
      if (relicGroups[relic.rarity]) {
        relicGroups[relic.rarity].push({ id, ...relic });
      }
    });

    const rarityTitles = {
      COMMON: { title: 'コモンレリック', color: 'text-slate-100', border: 'border-slate-500' },
      UNCOMMON: { title: 'アンコモンレリック', color: 'text-sky-300', border: 'border-sky-500' },
      RARE: { title: 'レアレリック', color: 'text-yellow-400', border: 'border-yellow-500' },
      EVENT: { title: 'イベントレリック', color: 'text-purple-400', border: 'border-purple-500' }
    };

    return (
      <div className="h-screen w-full overflow-y-auto bg-slate-900 text-white flex flex-col items-center p-4 sm:p-8">
        <div className="flex flex-wrap justify-between w-full max-w-6xl mb-6 items-center border-b border-slate-700 pb-4 gap-4">
          <h1 className="text-2xl sm:text-4xl font-bold flex items-center gap-3"><span>🎁</span> レリック図鑑</h1>
          <button onClick={() => setState(p => ({ ...p, screen: 'COMPENDIUM_MENU' }))} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold border border-slate-500 text-sm sm:text-base">
            戻る
          </button>
        </div>

        <div className="w-full max-w-6xl pb-8 flex flex-col gap-8">
          {['COMMON', 'UNCOMMON', 'RARE', 'EVENT'].map(rarity => {
            const relics = relicGroups[rarity];
            if (relics.length === 0) return null;
            const info = rarityTitles[rarity];

            return (
              <div key={rarity} className="w-full">
                <h2 className={`text-xl sm:text-2xl font-bold mb-4 border-b ${info.border} pb-2 flex items-center gap-2 ${info.color}`}>
                  {info.title}
                </h2>
                <div className="flex flex-wrap gap-6 justify-start">
                  {relics.map(relic => {
                    const isUnlocked = state.unlocks && state.unlocks.relics && state.unlocks.relics.includes(relic.id);

                    if (!isUnlocked) {
                      return (
                        <div key={relic.id} className="w-64 bg-slate-800 border-2 border-slate-700 rounded-xl p-4 flex flex-col items-center shadow-lg relative shrink-0 opacity-50 grayscale">
                          <div className="text-6xl mb-4 mt-4 drop-shadow-md">❓</div>
                          <h3 className="text-xl font-bold text-slate-500 mb-2 text-center">未知のレリック</h3>

            <span>⚙️</span> <span className="hidden sm:inline">メニュー</span>
          </button>

                    if (result.unlockCards) unlockData('cards', result.unlockCards);

                  className="w-full p-4 border-2 border-slate-600 bg-slate-800 hover:bg-slate-700 hover:border-yellow-400 rounded-xl text-left transition-colors flex items-center gap-4 shadow-lg"

                    {choice.text}
                  </span>
                </button>
              ))}
            </div>
          </div>

        {state.screen === 'MAP' && state.mapData && (
          <div ref={mapRef} className="flex-1 w-full overflow-y-auto bg-slate-950 relative scroll-smooth p-4">

              {/* Lines */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                {Object.values(state.mapData).map(node => {
                  return node.next.map(nextId => {
                    const nextNode = state.mapData[nextId];
                    const x1 = `${getMapX(node.x, node.floor)}%`;
                    const y1 = getMapY(node.floor);
                    const x2 = `${getMapX(nextNode.x, nextNode.floor)}%`;
                    const y2 = getMapY(nextNode.floor);

                    const isVisited = state.visitedNodes.includes(node.id);
                    const isPathTaken = isVisited && state.visitedNodes.includes(nextId);
                    const isCurrent = state.currentNodeId === node.id;
                    const isPathSelectable = isCurrent && node.next.includes(nextId);

                    let strokeColor = "#334155"; // slate-700
                    let strokeWidth = 2;
                    let dash = "0";

                    if (isPathTaken) {
                      strokeColor = "#eab308"; // yellow-500
                      strokeWidth = 4;
                    } else if (isPathSelectable) {
                      strokeColor = "#94a3b8"; // slate-400
                      strokeWidth = 3;
                      dash = "4 4";
                    }

                    return <line key={`${node.id}-${nextId}`} x1={x1} y1={y1} x2={x2} y2={y2} stroke={strokeColor} strokeWidth={strokeWidth} strokeDasharray={dash} />
                  });
                })}
              </svg>

              {/* Nodes */}
              {Object.values(state.mapData).map(node => {
                const isSelectable = state.currentNodeId === null ? node.floor === 1 : state.mapData[state.currentNodeId].next.includes(node.id);
                const isVisited = state.visitedNodes.includes(node.id);
                const isCurrent = state.currentNodeId === node.id;
                
                let bgClass = "bg-slate-800 border-slate-600";
                if (isCurrent) bgClass = "bg-yellow-900 border-yellow-500";
                else if (isVisited) bgClass = "bg-slate-900 border-slate-700 opacity-50 grayscale";
                else if (isSelectable) bgClass = "bg-slate-700 border-yellow-400 animate-pulse cursor-pointer hover:scale-110";
                
                const icon = getMapIcon(node.type);

                return (
                  <div 
                    key={node.id}
                    onClick={() => isSelectable && selectNode(node)}
                    onMouseEnter={() => handleNodeInteractionStart(node)}
                    onMouseLeave={handleNodeInteractionEnd}
                    onTouchStart={() => handleNodeInteractionStart(node)}
                    onTouchEnd={handleNodeInteractionEnd}
                    onTouchCancel={handleNodeInteractionEnd}
                    style={{ left: `${getMapX(node.x, node.floor)}%`, top: `${getMapY(node.floor)}px`, transform: 'translate(-50%, -50%)' }}
                    className={`absolute z-10 flex flex-col items-center justify-center w-10 h-10 sm:w-14 sm:h-14 rounded-full border-2 transition-all shadow-lg ${bgClass}`}
                  >
                    <span className="text-lg sm:text-2xl drop-shadow-md">{icon}</span>
                    {isSelectable && <span className="absolute -bottom-4 sm:-bottom-5 text-[9px] sm:text-[10px] font-bold text-yellow-400 whitespace-nowrap bg-slate-900/80 px-1 rounded">{node.type}</span>}

                <span className="font-bold text-lg sm:text-xl">休む</span>
                <span className="text-xs sm:text-sm text-slate-400 text-center mt-1">最大HPの30%回復</span>
              </button>
              <button onClick={() => setState(p => ({ ...p, screen: 'UPGRADE' }))} 
                className="flex flex-col items-center p-4 sm:p-6 w-40 sm:w-48 bg-slate-800 rounded-xl hover:bg-slate-700 border-2 border-transparent hover:border-blue-400 shrink-0">
                <span className="text-3xl sm:text-4xl mb-2">⚒️</span>
                <span className="font-bold text-lg sm:text-xl">鍛錬</span>
                <span className="text-xs sm:text-sm text-slate-400 text-center mt-1">カードを1枚アップグレード</span>
              </button>
              {state.player.relics.includes('umiwatari') && (
                <button onClick={() => setState(p => ({ ...p, screen: 'REMOVE_CARD' }))} 
                  className="flex flex-col items-center p-4 sm:p-6 w-40 sm:w-48 bg-slate-800 rounded-xl hover:bg-slate-700 border-2 border-transparent hover:border-red-400 shrink-0">
                  <span className="text-3xl sm:text-4xl mb-2">🗑️</span>
                  <span className="font-bold text-lg sm:text-xl">忘却</span>
                  <span className="text-xs sm:text-sm text-slate-400 text-center mt-1">デッキからカードを1枚削除する</span>
                </button>
              )}
            </div>
          </div>

        {state.screen === 'UPGRADE' && (
          <div className="flex-1 flex flex-col items-center p-4 sm:p-8 min-h-full relative">
            <h2 className="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center">アップグレードするカードを選択</h2>
            <div className="flex flex-wrap gap-4 justify-center max-w-4xl pb-8">
              {state.player.deck.map((card, idx) => (
                <div key={idx} onClick={() => {
                  if (card.upgraded || card.type === 'CURSE') return;
                  setUpgradePreviewIndex(idx);
                }} className={card.upgraded || card.type === 'CURSE' ? 'opacity-50 grayscale cursor-not-allowed' : 'cursor-pointer hover:-translate-y-2 transition'}>
                  {renderCard(card, idx)}
                </div>
              ))}
            </div>

            <div className="mt-4 mb-8">
              <button onClick={() => {
                setState(p => ({ ...p, screen: 'MAP' }));
              }} className="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold text-sm sm:text-base border border-slate-500">
                やめる
              </button>
            </div>

            {upgradePreviewIndex !== null && (
              <div className="fixed inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-4 sm:p-8 backdrop-blur-sm overflow-y-auto">
                <div className="flex flex-col items-center justify-center min-h-full w-full py-8">
                  <h2 className="text-xl sm:text-3xl font-bold text-white mb-6 sm:mb-8 text-center">このカードをアップグレードしますか？</h2>
                  
                  <div className="flex flex-wrap justify-center gap-4 sm:gap-16 items-center mb-8 sm:mb-12">
                    <div className="flex flex-col items-center opacity-70">
                      <span className="mb-2 sm:mb-4 text-xs sm:text-sm text-slate-400 font-bold">強化前</span>
                      {renderCard(state.player.deck[upgradePreviewIndex], upgradePreviewIndex, false)}
                    </div>
                    <div className="text-3xl sm:text-5xl text-yellow-400 font-bold animate-pulse rotate-90 sm:rotate-0">➡️</div>

            <div className="flex flex-wrap gap-4 justify-center max-w-4xl pb-8">
              {state.player.deck.map((card, idx) => (
                <div key={idx} onClick={() => {

                  {renderCard(card, idx)}

              <button onClick={() => {
                setState(p => ({ ...p, screen: p.returnScreen || 'MAP', returnScreen: null, removeCost: null }));
              }} className="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold text-sm sm:text-base border border-slate-500">
                やめる
              </button>
            </div>

            {removePreviewIndex !== null && (
              <div className="fixed inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-4 sm:p-8 backdrop-blur-sm overflow-y-auto">
                <div className="flex flex-col items-center justify-center min-h-full w-full py-8">
                  <h2 className="text-xl sm:text-3xl font-bold text-white mb-6 sm:mb-8 text-center text-red-400">このカードを削除しますか？</h2>
                  
                  <div className="flex flex-wrap justify-center gap-4 sm:gap-16 items-center mb-8 sm:mb-12">
                    <div className="flex flex-col items-center">
                      {renderCard(state.player.deck[removePreviewIndex], removePreviewIndex, false)}
                    </div>
                  </div>

                  <div className="flex flex-wrap justify-center gap-4 sm:gap-8 sticky bottom-4 z-10">
                    <button onClick={() => setRemovePreviewIndex(null)} className="px-6 py-3 sm:px-8 sm:py-4 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl border-2 border-slate-500 transition-colors text-sm sm:text-xl shrink-0 shadow-xl">
                      考え直す
                    </button>
                    <button onClick={() => {
                      let newDeck = [...state.player.deck];
                      newDeck.splice(removePreviewIndex, 1);
                      setRemovePreviewIndex(null);
                      setState(p => {
                        const cost = p.removeCost || 0;
                        const newGold = p.player.gold - cost;
                        return { ...p, screen: p.returnScreen || 'MAP', player: {...p.player, deck: newDeck, gold: newGold}, returnScreen: null, removeCost: null, shopRemovedCard: p.returnScreen === 'SHOP' ? true : p.shopRemovedCard };
                      });
                    }} className="px-6 py-3 sm:px-8 sm:py-4 bg-red-700 hover:bg-red-600 text-white font-bold rounded-xl border-2 border-red-400 transition-colors shadow-xl shadow-red-500/50 text-sm sm:text-xl shrink-0">
                      決定 (削除)
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* 宝箱画面 */}
        {state.screen === 'TREASURE' && (
          <div className="flex-1 flex flex-col items-center justify-center p-4 min-h-full">
            <h2 className="text-2xl sm:text-3xl font-bold mb-8">宝箱部屋</h2>
            
            {!state.treasureInfo.opened ? (
              <div className="flex flex-col items-center">
                <div 
                  className={`text-6xl sm:text-8xl mb-6 cursor-pointer hover:scale-110 transition-all ${
                    state.treasureInfo.rarity === 'RARE' ? 'drop-shadow-[0_0_30px_rgba(250,204,21,0.8)]' : 
                    state.treasureInfo.rarity === 'UNCOMMON' ? 'drop-shadow-[0_0_20px_rgba(56,189,248,0.6)]' :
                    'drop-shadow-[0_0_10px_rgba(255,255,255,0.4)]'
                  }`} 
                  onClick={() => setState(p => ({...p, treasureInfo: {...p.treasureInfo, opened: true}}))}
                >
                  {state.treasureInfo.rarity === 'RARE' ? '🏆' : state.treasureInfo.rarity === 'UNCOMMON' ? '🧰' : '📦'}
                </div>
                <p className="text-slate-400 font-bold animate-pulse">タップして開ける</p>
              </div>
            ) : (
              <div className="flex flex-col items-center w-full max-w-sm">
                {state.treasureInfo.relicId ? (
                  <>
                    <h3 className="text-xl mb-6 text-white font-bold">レリックを獲得した！</h3>
                    <div onClick={() => {
                      const relicId = state.treasureInfo.relicId;
                      unlockData('relics', [relicId]);
                      setState(p => {
                        let newDeck = [...p.player.deck];
                        if (relicId === 'blueCage') {
                          let skills = newDeck.map((c, i) => ({c, i})).filter(x => x.c.type === 'SKILL' && !x.c.upgraded);
                          skills = shuffle(skills);
                          const targetCount = Math.min(2, skills.length);
                          for(let i=0; i<targetCount; i++) {
                            newDeck[skills[i].i] = { ...newDeck[skills[i].i], upgraded: true };
                          }
                        }
                        return {
                          ...p,
                          screen: 'MAP',
                          player: { ...p.player, deck: newDeck, relics: [...p.player.relics, relicId] },
                          treasureInfo: null
                        };
                      });
                    }} className={`cursor-pointer bg-slate-800 p-4 rounded-xl border-2 ${getRelicBorderColor(RELICS_DB[state.treasureInfo.relicId].rarity)} hover:bg-slate-700 flex items-center gap-4 transition-transform hover:scale-105 w-full justify-center shadow-xl`}>
                      <div className="text-5xl shrink-0">{RELICS_DB[state.treasureInfo.relicId].icon}</div>
                      <div className="text-left flex-1 min-w-0">
                        <div className={`font-bold ${getRelicColor(RELICS_DB[state.treasureInfo.relicId].rarity)} text-lg mb-1 truncate`}>{RELICS_DB[state.treasureInfo.relicId].name}</div>
                        <div className="text-xs sm:text-sm text-slate-300 leading-tight">
                          {RELICS_DB[state.treasureInfo.relicId].desc.replace('${turn}', state.player.relicStates.starClockTurn)}
                        </div>
                      </div>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="text-6xl mb-4">💨</div>
                    <h3 className="text-xl mb-4 text-slate-400">宝箱は空っぽだった...</h3>
                    <button onClick={() => setState(p => ({...p, screen: 'MAP', treasureInfo: null}))} className="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold">
                      進む
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        )}

        {state.screen === 'EVENT' && (
          <div className="flex-1 flex flex-col items-center justify-center text-center p-4 sm:p-8 min-h-full">
            <div className="text-5xl sm:text-6xl mb-4 sm:mb-6">❓</div>
            <h2 className="text-2xl sm:text-3xl font-bold mb-2 sm:mb-4">{state.eventInfo.name}</h2>
            <p className="text-sm sm:text-xl text-slate-300 mb-8 sm:mb-12 max-w-2xl px-4">{state.eventInfo.desc}</p>
            
            <div className="flex flex-col gap-3 sm:gap-4 w-full max-w-xl px-4">
              {state.eventInfo.choices.map((choice, idx) => {
                const canSelect = !choice.condition || choice.condition(state);
                return (
                  <button 
                    key={idx}
                    disabled={!canSelect}
                    onClick={() => {
                      if (!canSelect) return;
                      const result = choice.effect(state);
                      let nextState = result.newState ? { ...result.newState } : { ...result };
                      
                      // 明示的に画面指定がない、またはEVENT画面のままの場合はマップへ戻す
                      if (!nextState.screen || nextState.screen === 'EVENT') {
                        nextState.screen = 'MAP';
                      }
                      
                      if (result.unlockCards) unlockData('cards', result.unlockCards);
                      if (result.unlockRelics) unlockData('relics', result.unlockRelics);
                      
                      setState(nextState);
                    }} 
                    className={`w-full p-3 sm:p-4 border-2 rounded-xl text-left flex flex-col transition-colors
                      ${canSelect 
                        ? 'bg-slate-800 hover:bg-slate-700 border-slate-600 hover:border-blue-400 cursor-pointer' 
                        : 'bg-slate-900 border-slate-800 opacity-50 cursor-not-allowed'}`}
                  >
                    <span className={`font-bold text-base sm:text-xl mb-1 ${canSelect ? 'text-blue-300' : 'text-slate-500'}`}>
                      {choice.text}
                    </span>
                    <span className={`text-xs sm:text-sm ${canSelect ? 'text-slate-400' : 'text-slate-600'}`}>
                      {choice.desc}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {state.screen === 'SHOP' && (
          <div className="flex-1 flex flex-col items-center p-4 sm:p-8 min-h-full">
            <div className="text-4xl sm:text-6xl mb-2 sm:mb-4 mt-4">🏪</div>
            <h2 className="text-2xl sm:text-3xl font-bold mb-2">ショップ</h2>
            <p className="text-yellow-400 mb-6 sm:mb-8 text-sm sm:text-base">所持金: {state.player.gold}G</p>
            
            <div className="flex flex-wrap justify-center gap-4 sm:gap-6 mb-8 max-w-4xl">
              {state.shopItems.map((card, idx) => (
                <div key={idx} className="flex flex-col items-center shrink-0">
                  {renderCard(card, idx)}
                  <button 
                    disabled={state.player.gold < card.price}
                    onClick={() => {
                      unlockData('cards', [card.id]);
                      let newShop = [...state.shopItems];
                      newShop.splice(idx, 1);
                      setState(p => ({ ...p, shopItems: newShop, player: {...p.player, gold: p.player.gold - card.price, deck: [...p.player.deck, card]} }));
                    }}
                    className={`mt-2 sm:mt-4 px-3 py-1 sm:px-4 sm:py-1 rounded font-bold text-xs sm:text-sm ${state.player.gold >= card.price ? 'bg-yellow-600 hover:bg-yellow-500 text-white' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}>
                    {card.price}Gで購入
                  </button>
                </div>
              ))}
              
              <div className="w-28 h-40 sm:w-32 sm:h-44 lg:w-36 lg:h-48 border-2 border-red-600 bg-red-900/50 rounded-lg flex flex-col items-center justify-center p-2 sm:p-4 shrink-0">
                <span className="text-3xl sm:text-4xl mb-1 sm:mb-2">🗑️</span>
                <span className="font-bold mb-1 sm:mb-2 text-xs sm:text-sm">カード削除</span>
                <span className="text-[10px] sm:text-xs text-center mb-2 sm:mb-4 text-slate-300">デッキからカードを<br/>1枚削除する</span>
                <button 
                    disabled={state.player.gold < 40 || state.shopRemovedCard}
                    onClick={() => {
                      setState(p => ({ ...p, screen: 'REMOVE_CARD', returnScreen: 'SHOP', removeCost: 40 }));
                    }}
                    className={`px-2 py-1 sm:px-4 sm:py-1 rounded font-bold text-[10px] sm:text-sm ${(state.player.gold >= 40 && !state.shopRemovedCard) ? 'bg-yellow-600 hover:bg-yellow-500 text-white' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}>
                    {state.shopRemovedCard ? '売切' : '40Gで購入'}
                </button>
              </div>
            </div>

            <button onClick={skipReward} className="px-6 py-2 sm:px-8 sm:py-3 bg-slate-700 hover:bg-slate-600 rounded font-bold text-sm sm:text-base mb-8">
              店を出る
            </button>
          </div>
        )}

        {state.screen === 'REWARD' && (
          <div className="flex-1 flex flex-col items-center p-4 sm:p-8 min-h-full">
            <h2 className="text-2xl sm:text-3xl font-bold mb-4 sm:mb-8 text-white mt-4">戦闘勝利！</h2>
            
            <p className="text-sm sm:text-xl mb-6 text-yellow-400 font-bold bg-slate-800 px-4 py-2 sm:px-6 sm:py-2 rounded-full border border-yellow-600">
              💰 {state.rewards.gold} ゴールド獲得
            </p>

            {/* レリック報酬UI */}
            {state.rewards.relic && (
              <div className="mb-8 flex flex-col items-center w-full max-w-sm px-4">
                <h3 className="text-base sm:text-xl mb-2 sm:mb-3 text-purple-300 font-bold">未知のレリックを発見！</h3>
                <div onClick={claimRelic} className={`cursor-pointer bg-slate-800 p-3 sm:p-4 rounded-xl border-2 ${getRelicBorderColor(RELICS_DB[state.rewards.relic].rarity)} hover:bg-slate-700 flex flex-wrap sm:flex-nowrap items-center gap-3 sm:gap-4 transition-transform hover:scale-105 shadow-lg shadow-slate-900/50 w-full justify-center`}>
                  <div className="text-4xl sm:text-5xl shrink-0">{RELICS_DB[state.rewards.relic].icon}</div>
                  <div className="text-center sm:text-left flex-1 min-w-[150px]">
                    <div className={`font-bold ${getRelicColor(RELICS_DB[state.rewards.relic].rarity)} text-base sm:text-lg mb-0.5 sm:mb-1`}>{RELICS_DB[state.rewards.relic].name}</div>
                    <div className="text-xs sm:text-sm text-slate-300 leading-tight mb-1">
                      {RELICS_DB[state.rewards.relic].desc.replace('${turn}', state.player.relicStates.starClockTurn)}
                    </div>
                    {RELICS_DB[state.rewards.relic].flavor && <div className="text-[10px] text-slate-500 italic">"{RELICS_DB[state.rewards.relic].flavor}"</div>}
                  </div>
                  <div className="text-xs sm:text-sm font-bold text-green-400 animate-pulse shrink-0">取得する</div>
                </div>
              </div>
            )}

            <h3 className="text-sm sm:text-xl mb-4 text-white text-center">カードを1枚デッキに追加できます</h3>
            <div className="flex flex-wrap justify-center gap-4 sm:gap-6 mb-8">
              {state.rewards.cards.map((card, idx) => (
                <div key={idx} onClick={() => claimCard(card)} className="cursor-pointer hover:-translate-y-2 transition shrink-0">
                  {renderCard(card, idx)}
                </div>
              ))}
            </div>
            
            <button onClick={skipReward} className="px-4 py-2 sm:px-6 sm:py-2 text-sm sm:text-base text-slate-400 hover:text-white transition-colors border border-transparent hover:border-slate-500 rounded mb-8">
              {state.player.relics.includes('singingBowl') ? '🌸 カードをスキップ (最大HP+2, HP+2)' : 'カードをスキップ'}
            </button>
          </div>
        )}

        {state.screen === 'COMBAT' && state.combat && (
          <div className="flex-1 flex flex-col justify-between p-2 md:p-4 bg-slate-900 min-h-full">
            
            <div className="flex flex-wrap justify-center items-end gap-2 sm:gap-4 lg:gap-12 mt-2 lg:mt-4 shrink-0 min-h-[120px] md:min-h-[160px] mb-4">
              {state.combat.enemies.map((enemy, idx) => renderEnemy(enemy, idx))}
            </div>

            <div className="flex justify-between items-end mb-2 md:mb-4 px-1 md:px-4 lg:px-8 flex-1 min-h-0 gap-1 md:gap-2">
              
              <div className="w-1/3 max-w-[200px] flex flex-col justify-end shrink-0">
                <div className="text-[10px] md:text-sm text-slate-400 mb-0.5 md:mb-1">戦闘ログ:</div>
                <div className="bg-slate-950 p-1 md:p-2 rounded text-[9px] sm:text-[10px] md:text-sm text-slate-300 h-16 md:h-24 overflow-y-auto border border-slate-800 leading-tight">
                  {state.combat.logs.map((log, i) => <div key={i} className="mb-0.5">{log}</div>)}
                </div>
              </div>

              <div className="flex flex-col items-center shrink-0 mx-1">
                <div className="text-2xl sm:text-3xl md:text-5xl mb-1">{state.player.characterId ? CHARACTERS[state.player.characterId].icon : '🧙‍♂️'}</div>
                
                <div className="flex flex-wrap justify-center gap-1 mb-1 text-[9px] sm:text-[10px] md:text-sm font-bold">
                  {state.combat.playerBlock > 0 && <span className="text-blue-300 bg-blue-900/50 px-1 sm:px-2 rounded">🛡️{state.combat.playerBlock}</span>}
                  {state.combat.playerStatuses.strength !== 0 && <span className={`${state.combat.playerStatuses.strength > 0 ? 'text-red-400 bg-red-900/50' : 'text-blue-400 bg-blue-900/50'} px-1 sm:px-2 rounded`}>💪{state.combat.playerStatuses.strength}</span>}
                  {state.combat.playerStatuses.weak > 0 && <span className="text-gray-400 bg-gray-800 px-1 sm:px-2 rounded">📉{state.combat.playerStatuses.weak}</span>}
                  {state.combat.playerStatuses.vulnerable > 0 && <span className="text-purple-400 bg-purple-900/50 px-1 sm:px-2 rounded">💔{state.combat.playerStatuses.vulnerable}</span>}
                  {state.combat.playerStatuses.poison > 0 && <span className="text-green-400 bg-green-900/50 px-1 sm:px-2 rounded">🧪{state.combat.playerStatuses.poison}</span>}
                </div>
              </div>

              <div className="flex flex-col items-end gap-1 md:gap-3 w-1/3 max-w-[200px] shrink-0">
                <div className="text-xl sm:text-2xl md:text-4xl font-extrabold text-blue-400 drop-shadow-md whitespace-nowrap">
                  ⚡ {state.combat.energy}
                </div>
                <button disabled={state.combat.discardSelectCount > 0} onClick={endTurn} className={`px-2 sm:px-4 lg:px-8 py-2 md:py-4 font-bold rounded-lg md:rounded-xl shadow-lg border-2 transition-colors text-[10px] sm:text-sm lg:text-xl whitespace-nowrap ${state.combat.discardSelectCount > 0 ? 'bg-slate-700 text-slate-500 border-slate-600 cursor-not-allowed' : 'bg-red-800 hover:bg-red-700 text-white border-red-900'}`}>
                  ターン終了
                </button>
              </div>
            </div>

            <div className="flex items-start justify-between lg:justify-center gap-1 sm:gap-2 lg:gap-8 bg-slate-800/50 p-1 sm:p-2 lg:p-4 rounded-xl border border-slate-700 shrink-0 w-full">
              <div className="flex flex-col items-center text-slate-400 cursor-pointer hover:text-white transition-colors shrink-0 px-1 sm:px-2 mt-2" onClick={() => setViewPile('DRAW')}>
                <div className="text-xl sm:text-2xl lg:text-3xl">🗂️</div>
                <div className="font-bold text-sm lg:text-xl">{state.combat.drawPile.length}</div>
                <div className="text-[9px] sm:text-xs">山札</div>
              </div>
              
              <div className="flex justify-center items-center gap-1 sm:gap-2 w-full py-2 px-1 overflow-hidden">
                {state.combat.hand.map((card, idx) => renderCard(card, idx, true))}
              </div>

              <div className="flex flex-col items-center text-slate-400 cursor-pointer hover:text-white transition-colors shrink-0 px-1 sm:px-2 mt-2" onClick={() => setViewPile('DISCARD')}>
                <div className="text-xl sm:text-2xl lg:text-3xl opacity-50">🗑️</div>
                <div className="font-bold text-sm lg:text-xl">{state.combat.discardPile.length}</div>
                <div className="text-[9px] sm:text-xs">捨て札</div>
              </div>
            </div>

            {viewPile && (
              <div className="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center p-4 sm:p-8 overflow-y-auto backdrop-blur-sm">
                <div className="flex justify-between w-full max-w-5xl mb-6 items-center border-b border-slate-700 pb-2 sm:pb-4">
                  <h2 className="text-xl sm:text-3xl font-bold text-white">
                    {viewPile === 'DRAW' ? '山札' : '捨て札'} ({viewPile === 'DRAW' ? state.combat.drawPile.length : state.combat.discardPile.length}枚)
                  </h2>
                  <button onClick={() => setViewPile(null)} className="px-4 py-1 sm:px-6 sm:py-2 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-lg transition-colors border border-slate-500 text-sm sm:text-base">
                    閉じる
                  </button>
                </div>
                <div className="flex flex-wrap gap-2 sm:gap-4 justify-center max-w-5xl pb-16">
                  {((viewPile === 'DRAW' ? state.combat.drawPile : state.combat.discardPile).length === 0) ? (
                    <div className="text-slate-500 text-sm sm:text-xl mt-12">カードがありません</div>
                  ) : (
                    (viewPile === 'DRAW' 
                      ? [...state.combat.drawPile].sort((a,b)=>a.name.localeCompare(b.name)) 
                      : [...state.combat.discardPile].sort((a,b)=>a.name.localeCompare(b.name))
                    ).map((card, idx) => (
                      <div key={card.uniqueId || idx} className="scale-90 sm:scale-95 origin-top hover:scale-100 transition-transform shrink-0">
                        {renderCard(card, idx, false)}
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {state.combat.discardSelectCount > 0 && (
              <div className="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
                <h2 className="text-2xl sm:text-3xl font-bold text-white mb-8 text-center">
                  捨てるカードを選択してください<br/>
                  <span className="text-sm sm:text-lg text-slate-400">あと {state.combat.discardSelectCount} 枚</span>
                </h2>
                <div className="flex flex-wrap justify-center gap-4 max-w-5xl">
                  {state.combat.hand.map((card, idx) => (
                    <div key={card.uniqueId} onClick={() => handleDiscardSelect(idx)} className="cursor-pointer hover:-translate-y-2 transition shrink-0 scale-90 sm:scale-100">
                      {renderCard(card, idx, false)}
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
