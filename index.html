// --- ヘルパー関数 ---
const shuffle = (array) => {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

const uid = () => Math.random().toString(36).substr(2, 9);

const parseCardText = (card) => {
  let text = card.desc;
  const dmg = card.upgraded && card.upDamage !== undefined ? card.upDamage : card.baseDamage;
  const blk = card.upgraded && card.upBlock !== undefined ? card.upBlock : card.baseBlock;
  const mgc = card.upgraded && card.upMagic !== undefined ? card.upMagic : card.magic;
  const drw = card.upgraded && card.upDraw !== undefined ? card.upDraw : card.draw;
  if(dmg !== undefined) text = text.replace('${dmg}', dmg);
  if(blk !== undefined) text = text.replace('${blk}', blk);
  if(mgc !== undefined) text = text.replace('${mgc}', mgc);
  if(drw !== undefined) text = text.replace('${draw}', drw);
  return text;
};

const getRandomCards = (count, characterId, excludeIds = []) => {
  const pool = CHARACTERS[characterId].cardPool.filter(id => CARD_DB[id].rarity !== 'BASIC' && !excludeIds.includes(id));
  
  const commonPool = shuffle(pool.filter(id => CARD_DB[id].rarity === 'COMMON'));
  const uncommonPool = shuffle(pool.filter(id => CARD_DB[id].rarity === 'UNCOMMON'));
  const rarePool = shuffle(pool.filter(id => CARD_DB[id].rarity === 'RARE'));

  let results = [];
  let available = [...pool];
  
  while (results.length < count && available.length > 0) {
    const rand = Math.random();
    let pickedId = null;
    
    if (rand < 0.05 && rarePool.length > 0) {
      pickedId = rarePool.pop();
    } else if (rand < 0.35 && uncommonPool.length > 0) {
      pickedId = uncommonPool.pop();
    } else if (commonPool.length > 0) {
      pickedId = commonPool.pop();
    } else {
      if (commonPool.length > 0) pickedId = commonPool.pop();
      else if (uncommonPool.length > 0) pickedId = uncommonPool.pop();
      else if (rarePool.length > 0) pickedId = rarePool.pop();
    }
    
    if (pickedId) {
      results.push(pickedId);
      available = available.filter(id => id !== pickedId);
    }
  }
  return results.map(k => ({ ...CARD_DB[k], uniqueId: uid(), upgraded: false }));
};

// --- マップ生成ロジック (DAG) ---
const generateMapData = () => {
  const FLOORS = 15;
  let nodes = {};
  
  for (let f = 1; f <= FLOORS; f++) {
    if (f === 15) {
      nodes[`15-1`] = { id: `15-1`, floor: 15, x: 1, type: 'BOSS', next: [] };
    } else if (f === 14) {
      nodes[`14-1`] = { id: `14-1`, floor: 14, x: 1, type: 'REST', next: [`15-1`] };
    } else {
      for (let x = 0; x < 3; x++) {
        nodes[`${f}-${x}`] = { id: `${f}-${x}`, floor: f, x: x, type: 'NORMAL', next: [] };
      }
    }
  }

  for (let f = 1; f <= 12; f++) {
    for (let x = 0; x < 3; x++) {
      let possibleNext = [x-1, x, x+1].filter(nx => nx >= 0 && nx < 3);
      let nextCount = Math.random() < 0.2 ? 2 : 1; 
      let nextNodes = shuffle(possibleNext).slice(0, nextCount);
      nextNodes.forEach(nx => {
        nodes[`${f}-${x}`].next.push(`${f+1}-${nx}`);
      });
    }
    for (let nx = 0; nx < 3; nx++) {
      let isConnected = false;
      for (let x = 0; x < 3; x++) {
        if (nodes[`${f}-${x}`].next.includes(`${f+1}-${nx}`)) {
          isConnected = true;
          break;
        }
      }
      if (!isConnected) {
        let possiblePrev = [nx-1, nx, nx+1].filter(x => x >= 0 && x < 3);
        let prevX = possiblePrev[Math.floor(Math.random() * possiblePrev.length)];
        nodes[`${f}-${prevX}`].next.push(`${f+1}-${nx}`);
      }
    }
  }
  
  for (let x = 0; x < 3; x++) {
    nodes[`13-${x}`].next.push(`14-1`);
  }

  Object.values(nodes).forEach(node => {
    node.next = [...new Set(node.next)];
  });

  const assignTasks = [
    { type: 'TREASURE', min: 10, max: 13 },
    { type: 'ELITE', min: 5, max: 7 },
    { type: 'ELITE', min: 8, max: 10 },
    { type: 'ELITE', min: 11, max: 13 },
    { type: 'SHOP', min: 2, max: 4 },
    { type: 'SHOP', min: 5, max: 7 },
    { type: 'SHOP', min: 8, max: 10 },
    { type: 'SHOP', min: 11, max: 13 },
    { type: 'REST', min: 2, max: 5 },
    { type: 'REST', min: 6, max: 9 },
    { type: 'REST', min: 10, max: 13 },
    { type: 'EVENT', min: 2, max: 2 },
    { type: 'EVENT', min: 3, max: 4 },
    { type: 'EVENT', min: 5, max: 6 },
    { type: 'EVENT', min: 7, max: 8 },
    { type: 'EVENT', min: 9, max: 11 },
    { type: 'EVENT', min: 12, max: 13 } 
  ];

  assignTasks.forEach(task => {
    let candidates = [];
    
    for (let f = task.min; f <= task.max; f++) {
      let normalNodes = [];
      for (let x = 0; x < 3; x++) {
        if (nodes[`${f}-${x}`].type === 'NORMAL') {
          normalNodes.push(`${f}-${x}`);
        }
      }
      if (normalNodes.length >= 2 || task.type === 'TREASURE') {
        candidates.push(...normalNodes);
      }
    }
    
    if (candidates.length === 0) {
      for (let f = 2; f <= 13; f++) {
        if (task.type === 'ELITE' && f < 5) continue;
        let normalNodes = [];
        for (let x = 0; x < 3; x++) {
          if (nodes[`${f}-${x}`].type === 'NORMAL') {
            normalNodes.push(`${f}-${x}`);
          }
        }
        if (normalNodes.length >= 2 || task.type === 'TREASURE') {
          candidates.push(...normalNodes);
        }
      }
    }

    if (candidates.length > 0) {
      let selectedNodeId = candidates[Math.floor(Math.random() * candidates.length)];
      nodes[selectedNodeId].type = task.type;
    }
  });

  return nodes;
};

  const [hasSeenTutorial, setHasSeenTutorial] = useState(false);
  const [showTutorial, setShowTutorial] = useState(false);
  
  const [hasSaveData, setHasSaveData] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [showDeckView, setShowDeckView] = useState(false);

  const [showTransferMenu, setShowTransferMenu] = useState(false);
  const [transferInput, setTransferInput] = useState('');
  const [transferOutput, setTransferOutput] = useState('');
  const [transferMessage, setTransferMessage] = useState('');

  const [deleteStep, setDeleteStep] = useState(0);

  const mapRef = useRef(null);
  const cheatClicksRef = useRef([]); 
  const bossCheatTimerRef = useRef(null);

  const MAP_HEIGHT = 1350;
  const getMapY = (floor) => MAP_HEIGHT - (floor * 80);
  const getMapX = (x, floor) => {
    if (floor === 14 || floor === 15) return 50;
    return 15 + x * 35;
  };
  const getMapIcon = (type) => {
    switch(type) {
      case 'NORMAL': return '⚔️';
      case 'ELITE': return '👿';
      case 'REST': return '🔥';
      case 'EVENT': return '❓';
      case 'SHOP': return '🏪';
      case 'TREASURE': return '📦';
      case 'BOSS': return '👹';
      default: return '❓';
    }
  };

  const unlockData = useCallback((type, ids) => {
    setState(p => {
      let currentUnlocks = p.unlocks || {};
      if (!currentUnlocks.cards) currentUnlocks.cards = [];
      if (!currentUnlocks.enemies) currentUnlocks.enemies = [];
      if (!currentUnlocks.relics) currentUnlocks.relics = [];
      if (!currentUnlocks.events) currentUnlocks.events = [];
      if (!currentUnlocks.achievements) currentUnlocks.achievements = [];

      let newArr = [...currentUnlocks[type]];
      let changed = false;
      ids.forEach(id => {
        if (!newArr.includes(id)) {
          newArr.push(id);
          changed = true;
        }
      });
      if (changed) {
        const newUnlocks = { ...currentUnlocks, [type]: newArr };

        // 図鑑の全コンプリートチェック
        if (type !== 'achievements' && !newUnlocks.achievements.includes('completionist')) {
          const cardsFull = newUnlocks.cards.length >= Object.keys(CARD_DB).length;
          const enemiesFull = newUnlocks.enemies.length >= Object.keys(ENEMY_DB).length;
          const relicsFull = newUnlocks.relics.length >= Object.keys(RELICS_DB).length;
          const eventsFull = newUnlocks.events.length >= EVENTS.length;

          if (cardsFull && enemiesFull && relicsFull && eventsFull) {
            newUnlocks.achievements = [...newUnlocks.achievements, 'completionist'];
          }
        }

        // 全実績コンプリートチェック (true_master)
        if (!newUnlocks.achievements.includes('true_master')) {
          const allAchIds = Object.keys(ACHIEVEMENTS_DB).filter(id => id !== 'true_master');
          const hasAllOthers = allAchIds.every(id => newUnlocks.achievements.includes(id));
          if (hasAllOthers) {
            newUnlocks.achievements = [...newUnlocks.achievements, 'true_master'];
          }
        }

        try {
          localStorage.setItem('slay_the_web_unlocks', JSON.stringify(newUnlocks));
        } catch(e) {}
        return { ...p, unlocks: newUnlocks };
      }
      return p;
    });
  }, []);

  useEffect(() => {
    if (state.screen === 'MAP' && mapRef.current) {
      const currentY = state.currentNodeId ? getMapY(state.mapData[state.currentNodeId].floor) : getMapY(1);
      mapRef.current.scrollTop = currentY - window.innerHeight / 2 + 100;
    }
  }, [state.screen, state.currentNodeId, state.mapData]);

  useEffect(() => {
    try {
      const saved = localStorage.getItem('slay_the_web_save');
      if (saved) {
        setHasSaveData(true);
      }
    } catch(e) {}
  }, []);

  // 実績の監視用エフェクト
  useEffect(() => {
    if (state.player.gold >= 300) {

      }

    if (state.player.deck.length >= 20) {

        unlockData('achievements', ['deck_builder']);
      }
    }
    if (state.player.eventDamageTaken >= 30) {
      if (!state.unlocks?.achievements?.includes('unlucky')) {
        unlockData('achievements', ['unlucky']);
      }
    }
  }, [state.player.gold, state.player.deck.length, state.player.eventDamageTaken, state.unlocks, unlockData]);

  useEffect(() => {
    if (state.combat && state.combat.playerBlock >= 100) {
      if (!state.unlocks?.achievements?.includes('absolute_defense')) {
        unlockData('achievements', ['absolute_defense']);
      }
    }
  }, [state.combat?.playerBlock, state.unlocks, unlockData]);

  const startGame = () => {
    try {
      localStorage.removeItem('slay_the_web_save');
    } catch(e) {}
    setHasSaveData(false);
    setState(prev => ({ ...prev, screen: 'CHAR_SELECT' }));
  };

  const handleContinue = () => {
    try {
      const savedStr = localStorage.getItem('slay_the_web_save');
      if (savedStr) {
        const saved = JSON.parse(savedStr);
        if (saved.eventInfoId) {
          saved.eventInfo = EVENTS.find(e => e.id === saved.eventInfoId);
        }
        if (saved.neowChoiceTexts) {
          saved.neowChoices = saved.neowChoiceTexts.map(text => NEOW_BONUSES.find(nb => nb.text === text)).filter(Boolean);
        }
        setState(p => ({ ...p, ...saved }));
      }
    } catch(e) {
      console.error('Failed to load save data', e);
    }
  };

  const saveAndQuit = () => {
    const dataToSave = {
      act: state.act,
      floor: state.floor,
      player: state.player,
      mapData: state.mapData,
      currentNodeId: state.currentNodeId,
      visitedNodes: state.visitedNodes,
      screen: state.screen,
      combat: state.combat,
      rewards: state.rewards,
      shopItems: state.shopItems,
      treasureInfo: state.treasureInfo,
      isBossDefeated: state.isBossDefeated,
      eventInfoId: state.eventInfo ? state.eventInfo.id : null,
      neowChoiceTexts: state.neowChoices ? state.neowChoices.map(c => c.text) : null
    };
    try {
      localStorage.setItem('slay_the_web_save', JSON.stringify(dataToSave));
      setHasSaveData(true);
    } catch(e) {
      console.error(e);
    }
    setShowMenu(false);
    setState(p => ({ ...p, screen: 'TITLE' }));
  };

  const handleExport = () => {
    try {
      const unlocksStr = localStorage.getItem('slay_the_web_unlocks');
      const saveStr = localStorage.getItem('slay_the_web_save');
      const data = {
        unlocks: unlocksStr ? JSON.parse(unlocksStr) : null,
        save: saveStr ? JSON.parse(saveStr) : null
      };
      const code = btoa(encodeURIComponent(JSON.stringify(data)));
      setTransferOutput(code);
      setTransferMessage('コードを生成しました！ 全てコピーして保存してください。');
    } catch (e) {
      setTransferMessage('エラー: コードの生成に失敗しました。');
    }
  };

  const handleImport = () => {
    if (!transferInput) {
      setTransferMessage('コードが入力されていません。');
      return;
    }
    try {
      const jsonStr = decodeURIComponent(atob(transferInput));
      const data = JSON.parse(jsonStr);
      
      if (data.unlocks) {
        localStorage.setItem('slay_the_web_unlocks', JSON.stringify(data.unlocks));
      } else {
        localStorage.removeItem('slay_the_web_unlocks');
      }

      if (data.save) {
        localStorage.setItem('slay_the_web_save', JSON.stringify(data.save));
        setHasSaveData(true);
      } else {
        localStorage.removeItem('slay_the_web_save');
        setHasSaveData(false);
      }

      setState(p => ({ ...p, unlocks: data.unlocks || { cards: [], enemies: [], relics: [], events: [], achievements: [] } }));
      setTransferMessage('データの復元に成功しました！');
      setTransferInput('');
    } catch (e) {
      setTransferMessage('エラー: 無効なコード、または形式が間違っています。');
    }
  };

  const deleteWarnings = [
    "",
    "本当に全データを削除しますか？",
    "図鑑の解放状況もすべて消滅します。本当によろしいですか？",
    "獲得した実績もすべてゼロになります。取り返しがつきません。",
    "セーブデータも完全に消去されます。後悔しませんね？",
    "これが最後の警告です。本当に、全データを削除して初期化しますか？"
  ];

  const handleDeleteData = () => {
    if (deleteStep < 5) {
      setDeleteStep(deleteStep + 1);
    } else {
      try {
        localStorage.removeItem('slay_the_web_unlocks');
        localStorage.removeItem('slay_the_web_save');
      } catch(e) {}
      setHasSaveData(false);
      setState(p => ({
        ...p,
        unlocks: { cards: [], enemies: [], relics: [], events: [], achievements: [] }
      }));
      setDeleteStep(0);
      setShowTransferMenu(false);
    }
  };

  const cancelDelete = () => {
    setDeleteStep(0);
  };

  const selectCharacter = (charId) => {
    const charData = CHARACTERS[charId];
    const startingDeck = charData.startingDeck.map(id => ({ ...CARD_DB[id], uniqueId: uid(), upgraded: false }));
    
    unlockData('cards', charData.startingDeck);
    const generatedMap = generateMapData();

    const buffs = shuffle(NEOW_BONUSES.filter(b => b.type === 'BUFF')).slice(0, 2);
    const penalties = shuffle(NEOW_BONUSES.filter(b => b.type === 'PENALTY')).slice(0, 1);
    const neowChoices = [...buffs, ...penalties];

    setState(prev => ({
      ...prev, screen: 'NEOW', act: 1, floor: 1, isBossDefeated: false,
      player: { characterId: charId, hp: charData.hp, maxHp: charData.maxHp, maxEnergy: 3, gold: 50, deck: startingDeck, relics: [], relicStates: { starClockTurn: 0 }, neowsLament: 0, eventDamageTaken: 0 },
      mapData: generatedMap,
      currentNodeId: null,
      visitedNodes: [],
      neowChoices: neowChoices,
      treasureInfo: null
    }));
  };

  const handleNodeInteractionStart = (node) => {
    if (state.act === 1 && node.type === 'BOSS') {
      bossCheatTimerRef.current = setTimeout(() => {
        startCombat('BOSS', node.id, node.floor, true);
      }, 5000);
    }
  };

  const handleNodeInteractionEnd = () => {
    if (bossCheatTimerRef.current) {
      clearTimeout(bossCheatTimerRef.current);
      bossCheatTimerRef.current = null;
    }
  };

  const selectNode = (node) => {
    handleNodeInteractionEnd(); 
    if (node.type === 'NORMAL' || node.type === 'ELITE' || node.type === 'BOSS') {
      startCombat(node.type, node.id, node.floor);
    } else if (node.type === 'REST') {
      setState(p => ({ ...p, currentNodeId: node.id, visitedNodes: [...p.visitedNodes, node.id], floor: node.floor, screen: 'REST' }));
    } else if (node.type === 'EVENT') {
      const availableEvents = EVENTS.filter(ev => !ev.encounterCondition || ev.encounterCondition(state));
      const ev = availableEvents[Math.floor(Math.random() * availableEvents.length)];
      unlockData('events', [ev.id]);
      setState(p => ({ ...p, currentNodeId: node.id, visitedNodes: [...p.visitedNodes, node.id], floor: node.floor, screen: 'EVENT', eventInfo: ev }));
    } else if (node.type === 'SHOP') {
      const shopCards = getRandomCards(3, state.player.characterId).map(c => ({...c, price: 50 + Math.floor(Math.random()*30)}));
      unlockData('cards', shopCards.map(c => c.id)); 
      setState(p => ({ ...p, currentNodeId: node.id, visitedNodes: [...p.visitedNodes, node.id], floor: node.floor, screen: 'SHOP', shopItems: shopCards, shopRemovedCard: false }));
    } else if (node.type === 'TREASURE') {
      const rand = Math.random();
      let targetRarity = 'COMMON';
      if (rand < 0.10) targetRarity = 'RARE';
      else if (rand < 0.40) targetRarity = 'UNCOMMON';

      let availableRelics = Object.keys(RELICS_DB).filter(id => !state.player.relics.includes(id) && RELICS_DB[id].rarity === targetRarity);

      if (availableRelics.length === 0) {
        const allAvailable = Object.keys(RELICS_DB).filter(id => !state.player.relics.includes(id) && RELICS_DB[id].rarity !== 'EVENT');
        if (allAvailable.length > 0) {
          availableRelics = [allAvailable[Math.floor(Math.random() * allAvailable.length)]];
          targetRarity = RELICS_DB[availableRelics[0]].rarity;
        }
      }

      let selectedRelicId = null;
      if (availableRelics.length > 0) {
        selectedRelicId = availableRelics[Math.floor(Math.random() * availableRelics.length)];
      }

      setState(p => ({
        ...p,
        currentNodeId: node.id,
        visitedNodes: [...p.visitedNodes, node.id],
        floor: node.floor,
        screen: 'TREASURE',
        treasureInfo: {
          relicId: selectedRelicId,
          rarity: targetRarity,
          opened: false
        }
      }));
    }
  };

  const startCombat = (type, nodeId, floor, cheatBossHp1 = false) => {
    const createEnemy = (enemyId) => {
      const enemyBase = ENEMY_DB[enemyId];
      return {
        ...enemyBase,
        id: uid(),
        dbId: enemyId, 
        maxHp: enemyBase.hp,
        block: enemyBase.startingBlock || 0,
        statuses: { poison: 0, weak: 0, vulnerable: 0, strength: 0, turnDamage: 0, ...enemyBase.statuses },
        intentIndex: 0,
        intent: enemyBase.intents[0],
        stolenGold: 0,
        escaped: false
      };
    };

    let enemies = [];
    
    if (type === 'BOSS') {
      enemies.push(createEnemy(state.act === 1 ? 'guardian' : 'silent'));
    } else if (type === 'ELITE') {
      if (state.act === 1) {
        const elitePool = ['nob', 'lagavulin', 'sentry'];
        enemies.push(createEnemy(elitePool[Math.floor(Math.random() * elitePool.length)]));
      } else {
        const elitePool = ['boss_thief', 'floating_rock', 'angry_nob'];
        const eId = elitePool[Math.floor(Math.random() * elitePool.length)];
        enemies.push(createEnemy(eId));
        if (eId === 'boss_thief') {
          enemies.push(createEnemy('thief'));
        }
      }
    } else {
      if (state.act === 1) {
        if (Math.random() < 0.10) {
          const pairPool = [
            ['slime', 'acidslime'],
            ['cultist', 'jawworm']
          ];
          const selectedPair = pairPool[Math.floor(Math.random() * pairPool.length)];
          enemies.push(createEnemy(selectedPair[0]));
          enemies.push(createEnemy(selectedPair[1]));
        } else {
          const normalPool = ['slime', 'cultist', 'jawworm', 'thief', 'acidslime'];
          const enemyId = normalPool[Math.floor(Math.random() * normalPool.length)];
          if (enemyId === 'slime') {
            enemies.push(createEnemy('slime'));
            enemies.push(createEnemy('slime'));
          } else if (enemyId === 'thief') {
            enemies.push(createEnemy('thief'));
            enemies.push(createEnemy('thief')); 
          } else {
            enemies.push(createEnemy(enemyId));
          }
        }
      } else {
        // Act 2 Normal
        const normalPool = ['sphere_guardian', 'rotten_plant', 'fly_bomb', 'wall_vortex', 'caboon', 'cultist', 'thief'];
        const enemyId = normalPool[Math.floor(Math.random() * normalPool.length)];
        if (enemyId === 'caboon') {
          enemies.push(createEnemy('caboon'));
          enemies.push(createEnemy('caboon'));
        } else if (enemyId === 'thief') {
          enemies.push(createEnemy('thief'));
          enemies.push(createEnemy('thief'));
        } else {
          enemies.push(createEnemy(enemyId));
        }
      }
    }

    if (state.player.neowsLament > 0 || cheatBossHp1) {
      enemies = enemies.map(e => ({ ...e, hp: 1, maxHp: 1 }));
    }

    unlockData('enemies', enemies.map(e => e.dbId));

    let deck = shuffle([...state.player.deck]);
    let hand = deck.splice(0, 5);

    setViewPile(null);

    let initialBlock = 0;
    let initialEnergy = state.player.maxEnergy;
    let newRelicStates = { ...state.player.relicStates };
    let initialLogs = ['戦闘開始！'];

    setState(p => {
      let currentNeowsLament = p.player.neowsLament;
      if (currentNeowsLament > 0 || cheatBossHp1) {
        if (currentNeowsLament > 0) currentNeowsLament -= 1;
        initialLogs.push('🐋 ネオーの祝福（または不思議な力）で敵のHPが1になった！');
      }

      if (p.player.relics.includes('starClock')) {
        newRelicStates.starClockTurn += 1;
        if (newRelicStates.starClockTurn >= 10) {
          initialEnergy += 1;
          newRelicStates.starClockTurn = 0;
          initialLogs.push('⏳ 星時計が発動！エナジー+1');
        }
      }
      if (p.player.relics.includes('ironCrest')) {
        initialBlock += 3;
        initialLogs.push('🛡️ アイアンクレストが発動！ブロック+3');
      }
      
      if (p.player.relics.includes('blackSword')) {
        newRelicStates.blackSwordActive = true;
        initialLogs.push('🗡️ 黒い剣が輝き、守りの態勢に入った。');
      }

      return {
        ...p,
        currentNodeId: nodeId,
        visitedNodes: [...p.visitedNodes, nodeId],
        floor: floor,
        screen: 'COMBAT',
        player: { ...p.player, relicStates: newRelicStates, neowsLament: currentNeowsLament },
        combat: {
          enemies: enemies,
          drawPile: deck,
          hand: hand,
          discardPile: [],
          energy: initialEnergy,
          playerBlock: initialBlock,
          playerStatuses: { 
            weak: 0, vulnerable: 0, strength: 0, poison: 0, retainBlock: false, retainBlockOnce: false, 
            demonForm: 0, noxiousFumes: 0, poisonThorns: 0, metallicize: 0, cursedBlood: 0, caltrops: 0, toxicAmplification: 0,
            nextTurnBlock: 0, envenom: 0, afterImage: 0, combust: 0, brutality: 0, infiniteBlades: 0, accuracy: 0, venomous_shivs: 0
          },
          discardSelectCount: 0,
          turn: 1,
          logs: initialLogs
        }
      };
    });
  };

  const addLog = (msg, combatState) => {
    combatState.logs = [msg, ...combatState.logs].slice(0, 5);
  };

  const handleDiscardSelect = (idx) => {
    let newCombat = { ...state.combat };
    const discardedCard = newCombat.hand.splice(idx, 1)[0];
    newCombat.discardPile.push(discardedCard);
    addLog(`${discardedCard.name}を捨てた。`, newCombat);
    newCombat.discardSelectCount -= 1;
    if (newCombat.hand.length === 0) {
      newCombat.discardSelectCount = 0;
    }
    setState(p => ({ ...p, combat: newCombat }));
  };

  const playCard = (cardIdx, targetEnemyIdx = null) => {
    const { combat, player } = state;
    const card = combat.hand[cardIdx];

    if (card.type === 'CURSE') return; 

    const cardCost = card.upgraded && card.costUp !== undefined ? card.costUp : card.cost;
    if (combat.energy < cardCost) return;

    const isSilencedTurn = combat.turn % 3 === 0 && combat.enemies.some(e => e.statuses.silence_aura && e.hp > 0);
    if (isSilencedTurn && card.type === 'ATTACK') return;

    let newCombat = { ...combat, hand: [...combat.hand], discardPile: [...combat.discardPile], enemies: [...combat.enemies], playerStatuses: {...combat.playerStatuses} };
    let newPlayer = { ...player };

    newCombat.energy -= cardCost;
    newCombat.hand.splice(cardIdx, 1);

    const isExhaust = card.upgraded && card.upExhaust !== undefined ? card.upExhaust : card.exhaust;

    if (card.type === 'POWER' || isExhaust) {
      addLog(`${card.name}を使用した。(廃棄)`, newCombat);
    } else {
      newCombat.discardPile.push(card);
      addLog(`${card.name}を使用した。`, newCombat);
    }

    if (newCombat.playerStatuses.afterImage > 0) {
      newCombat.playerBlock += newCombat.playerStatuses.afterImage;
    }

    let dmg = card.upgraded && card.upDamage !== undefined ? card.upDamage : card.baseDamage;
    let blk = card.upgraded && card.upBlock !== undefined ? card.upBlock : card.baseBlock;
    const mgc = card.upgraded && card.upMagic !== undefined ? card.upMagic : card.magic;
    const drw = card.upgraded && card.upDraw !== undefined ? card.upDraw : card.draw;

    if (card.id === 'heavy_blade') {
        dmg += newCombat.playerStatuses.strength * (card.upgraded ? 4 : 2); 
    }
    if (card.id === 'shiv') {
        dmg += (newCombat.playerStatuses.accuracy || 0);
    }

    if (card.id === 'power_guard') {
      blk = newCombat.playerStatuses.strength * (card.upgraded ? 5 : 3);
    }

    if (blk) newCombat.playerBlock += blk;
    
    if (card.id === 'entrench') {
      newCombat.playerBlock *= 2;
    }
    if (card.id === 'shield_tackle') {
      applyDamageToEnemy(targetEnemyIdx, newCombat.playerBlock, newCombat);
    }
    if (card.id === 'defense_mastery') {
      newCombat.playerStatuses.retainBlock = true;
    }
    
    if (card.id === 'survivor') {
      if (newCombat.hand.length > 0) {
        newCombat.discardSelectCount = (newCombat.discardSelectCount || 0) + 1;
      }
    }

    if (card.id === 'bodyslam') {
      const bsDmg = newCombat.playerBlock;
      applyDamageToEnemy(targetEnemyIdx, bsDmg, newCombat);
    }
    else if (card.id === 'adrenaline') {
      newCombat.energy += mgc;
    }
    else if (card.id === 'inflame') {
      newCombat.playerStatuses.strength += mgc;
    }
    else if (card.id === 'limitbreak') {
      newCombat.playerStatuses.strength *= 2;
    }
    else if (card.id === 'heal') {
      newPlayer.hp = Math.min(newPlayer.maxHp, newPlayer.hp + mgc);
    }
    else if (card.id === 'bouncingflask') {
      let hitCount = 0;
      for(let i=0; i<3; i++) {
        const aliveEnemies = newCombat.enemies.map((e, index) => ({e, index})).filter(x => x.e.hp > 0);
        if(aliveEnemies.length > 0) {
          const target = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
          newCombat.enemies[target.index].statuses.poison += mgc;
          hitCount++;
        }
      }
      if (hitCount > 0) addLog(`フラスコ投擲が${hitCount}回命中！`, newCombat);
    }
    else if (card.id === 'venom_burst') {
      let target = newCombat.enemies[targetEnemyIdx];
      if (target && target.hp > 0) {
        const burstDmg = target.statuses.poison * (card.upgraded ? 4 : 3);
        applyDamageToEnemy(targetEnemyIdx, burstDmg, newCombat);
        drawCards(3, newCombat);
      }
    }
    else if (card.id === 'offering') {
      newPlayer.hp = Math.max(1, newPlayer.hp - 6);
      newCombat.energy += 2;
    }
    else if (card.id === 'unyielding_spirit') {
      newPlayer.hp = Math.min(newPlayer.maxHp, newPlayer.hp + mgc);
      if (newCombat.playerStatuses.weak > 0) newCombat.playerStatuses.weak--;
      if (newCombat.playerStatuses.vulnerable > 0) newCombat.playerStatuses.vulnerable--;
    }
    else if (card.id === 'demon_form') {
      newCombat.playerStatuses.demonForm += mgc;
    }
    else if (card.id === 'noxious_fumes') {
      newCombat.playerStatuses.noxiousFumes += mgc;
    }
    else if (card.id === 'serpents_reflex') {
      newCombat.playerStatuses.poisonThorns += mgc;
    }
    else if (card.id === 'blood_shield') {
      newPlayer.hp = Math.max(1, newPlayer.hp - 3);
    }
    else if (card.id === 'metallicize') {
      newCombat.playerStatuses.metallicize += mgc;
    }
    else if (card.id === 'cursed_blood') {
      newCombat.playerStatuses.cursedBlood += mgc;
    }
    else if (card.id === 'blur') {
      newCombat.playerStatuses.retainBlockOnce = true;
    }
    else if (card.id === 'caltrops') {
      newCombat.playerStatuses.caltrops += mgc;
    }
    else if (card.id === 'toxic_amplification') {
      newCombat.playerStatuses.toxicAmplification += mgc;
    }
    else if (card.id === 'dodge_and_roll') {
      newCombat.playerStatuses.nextTurnBlock += mgc;
    }
    else if (card.id === 'combust') {
      newCombat.playerStatuses.combust += mgc;
    }
    else if (card.id === 'brutality') {
      newCombat.playerStatuses.brutality += mgc;
    }
    else if (card.id === 'envenom') {
      newCombat.playerStatuses.envenom += mgc;
    }
    else if (card.id === 'after_image') {
      newCombat.playerStatuses.afterImage += mgc;
    }
    else if (card.id === 'bloodletting') {
      newPlayer.hp = Math.max(1, newPlayer.hp - 3);
      newCombat.energy += mgc;
    }
    else if (card.id === 'blade_dance' || card.id === 'cloak_and_dagger') {
      for(let i=0; i<mgc; i++) {
         newCombat.hand.push({ ...CARD_DB['shiv'], uniqueId: uid(), upgraded: false });
      }
    }
    else if (card.id === 'infinite_blades') {
      newCombat.playerStatuses.infiniteBlades = (newCombat.playerStatuses.infiniteBlades || 0) + mgc;
    }
    else if (card.id === 'accuracy') {
      newCombat.playerStatuses.accuracy = (newCombat.playerStatuses.accuracy || 0) + mgc;
    }
    else if (card.id === 'venomous_shivs') {
      newCombat.playerStatuses.venomous_shivs = (newCombat.playerStatuses.venomous_shivs || 0) + mgc;
    }

    if (card.target === 'ENEMY' && targetEnemyIdx !== null) {
      if (card.id === 'twin_strike') {
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        if (newCombat.playerStatuses.envenom > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
          newCombat.enemies[targetEnemyIdx].statuses.poison += newCombat.playerStatuses.envenom * 2;
        }
      } else if (card.id === 'furious_blade') {
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        newCombat.playerStatuses.strength += mgc;
        if (newCombat.playerStatuses.envenom > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
          newCombat.enemies[targetEnemyIdx].statuses.poison += newCombat.playerStatuses.envenom;
        }
      } else if (card.id === 'venom_fang') {
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        let p = card.upgraded ? newCombat.playerBlock : Math.floor(newCombat.playerBlock / 2);
        if (newCombat.playerStatuses.envenom > 0) p += newCombat.playerStatuses.envenom;
        if (p > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
           newCombat.enemies[targetEnemyIdx].statuses.poison += p;
        }
      } else if (card.id === 'dropkick') {
        let target = newCombat.enemies[targetEnemyIdx];
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        if (target && target.hp > 0 && target.statuses.vulnerable > 0) {
           newCombat.energy += 1;
           drawCards(1, newCombat);
           addLog(`対象が弱点状態のため、エナジーとカードを獲得！`, newCombat);
        }
      } else if (card.id === 'crimson_strike') {
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        if (newPlayer.hp <= newPlayer.maxHp / 2 && newCombat.enemies[targetEnemyIdx].hp > 0) {
           applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
           addLog(`HPが半分以下のため、紅蓮撃が2回発動！`, newCombat);
        }
      } else if (card.id === 'shiv') {
        applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
        if (newCombat.playerStatuses.venomous_shivs > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
           newCombat.enemies[targetEnemyIdx].statuses.poison += newCombat.playerStatuses.venomous_shivs;
        }
        if (newCombat.playerStatuses.envenom > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
           newCombat.enemies[targetEnemyIdx].statuses.poison += newCombat.playerStatuses.envenom;
        }
      } else {
        if (dmg) {
          applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
          if (card.type === 'ATTACK' && newCombat.playerStatuses.envenom > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
            newCombat.enemies[targetEnemyIdx].statuses.poison += newCombat.playerStatuses.envenom;
          }
        }
        if (mgc) applyDebuffToEnemy(targetEnemyIdx, card, mgc, newCombat);

        if (card.id === 'bane') {
          let target = newCombat.enemies[targetEnemyIdx];
          if (target && target.hp > 0 && target.statuses.poison > 0) {
            applyDamageToEnemy(targetEnemyIdx, dmg, newCombat);
            addLog(`毒状態の敵に追撃！`, newCombat);
            if (newCombat.playerStatuses.envenom > 0 && newCombat.enemies[targetEnemyIdx].hp > 0) {
              newCombat.enemies[targetEnemyIdx].statuses.poison += newCombat.playerStatuses.envenom;
            }
          }
        }
      }
    }
    else if (card.target === 'ALL_ENEMIES') {
      if (card.id === 'sword_boomerang') {
        for (let i = 0; i < mgc; i++) {
          const aliveEnemies = newCombat.enemies.map((e, index) => ({e, index})).filter(x => x.e.hp > 0);
          if (aliveEnemies.length > 0) {
            const target = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
            applyDamageToEnemy(target.index, dmg, newCombat);
            if (newCombat.playerStatuses.envenom > 0 && newCombat.enemies[target.index].hp > 0) {
              newCombat.enemies[target.index].statuses.poison += newCombat.playerStatuses.envenom;
            }
          }
        }
      }
      else if (card.id === 'dagger_spray') {
        newCombat.enemies.forEach((e, idx) => {
          if(e.hp > 0) {
            applyDamageToEnemy(idx, dmg, newCombat);
            if (newCombat.playerStatuses.envenom > 0 && e.hp > 0) e.statuses.poison += newCombat.playerStatuses.envenom;
            if (e.hp > 0) applyDamageToEnemy(idx, dmg, newCombat);
            if (newCombat.playerStatuses.envenom > 0 && e.hp > 0) e.statuses.poison += newCombat.playerStatuses.envenom;
          }
        });
      }
      else if (card.id === 'toxic_flurry') {
        for (let i = 0; i < 3; i++) {
          const aliveEnemies = newCombat.enemies.map((e, index) => ({e, index})).filter(x => x.e.hp > 0);
          if (aliveEnemies.length > 0) {
            const target = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
            applyDamageToEnemy(target.index, dmg, newCombat);
            newCombat.enemies[target.index].statuses.poison += mgc;
            if (newCombat.playerStatuses.envenom > 0 && newCombat.enemies[target.index].hp > 0) {
              newCombat.enemies[target.index].statuses.poison += newCombat.playerStatuses.envenom;
            }
          }
        }
      }
      else if (card.id === 'shadow_dodge') {
        newCombat.enemies.forEach(e => {
          if (e.hp > 0) e.statuses.weak += mgc;
        });
      }
      else if (card.id === 'crippling_cloud') {
        newCombat.enemies.forEach(e => {
          if (e.hp > 0) {
             e.statuses.poison += mgc;
             e.statuses.weak += 2;
          }
        });
      }
      else if (card.id === 'shockwave') {
        newCombat.enemies.forEach(e => {
          if (e.hp > 0) {
             e.statuses.weak += mgc;
             e.statuses.vulnerable += mgc;
          }
        });
      }
      else if (card.id === 'intimidate') {
        newCombat.enemies.forEach(e => {
          if (e.hp > 0) {
             e.statuses.weak += mgc;
          }
        });
      }
      else {
        newCombat.enemies.forEach((e, idx) => {
          if(e.hp > 0) {
            if (dmg) {
               applyDamageToEnemy(idx, dmg, newCombat);
               if (card.type === 'ATTACK' && newCombat.playerStatuses.envenom > 0 && e.hp > 0) {
                 e.statuses.poison += newCombat.playerStatuses.envenom;
               }
            }
            if (mgc) applyDebuffToEnemy(idx, card, mgc, newCombat);
            
            if (card.id === 'explosive_slash' && newCombat.playerStatuses.strength > 0) {
              e.statuses.vulnerable += mgc;
            }
          }
        });
      }
    }

    if (drw) {
      drawCards(drw, newCombat);
    }

    checkEnemiesDead(newCombat, newPlayer);

    setState(p => ({ ...p, combat: newCombat, player: newPlayer }));
    setSelectedCardIndex(null);

    if (newCombat.enemies.every(e => e.hp <= 0)) {
       handleVictory(newCombat.enemies[0], newPlayer);
    }
  };

  const applyDamageToEnemy = (idx, baseDmg, combatState) => {
    let enemy = combatState.enemies[idx];
    if(enemy.hp <= 0) return;

    let finalDmg = baseDmg + combatState.playerStatuses.strength;
    finalDmg = Math.max(0, finalDmg); 
    if (combatState.playerStatuses.weak > 0) finalDmg = Math.floor(finalDmg * 0.75); 
    if (enemy.statuses.vulnerable > 0) finalDmg = Math.floor(finalDmg * 1.5);

    if (enemy.statuses.sturdy) {
        const remaining = enemy.statuses.sturdy - (enemy.statuses.turnDamage || 0);
        if (remaining <= 0) finalDmg = 0;
        else if (finalDmg > remaining) finalDmg = remaining;
        enemy.statuses.turnDamage = (enemy.statuses.turnDamage || 0) + finalDmg;
    }

    if (enemy.block >= finalDmg) {
      enemy.block -= finalDmg;
    } else {
      enemy.hp -= (finalDmg - enemy.block);
      enemy.block = 0;
    }

    if (enemy.statuses.malleable && finalDmg > 0 && enemy.hp > 0) {
        enemy.block += enemy.statuses.malleable;
        addLog(`🌱 ${enemy.name}の鍛錬！ブロックを${enemy.statuses.malleable}得た！`, combatState);
    }
  };

  const applyDebuffToEnemy = (idx, card, mgc, combatState) => {
    let enemy = combatState.enemies[idx];
    if(enemy.hp <= 0) return;

    if (card.id === 'bash' || card.id === 'uppercut' || card.id === 'terror' || card.id === 'calculated_plan') enemy.statuses.vulnerable += mgc;
    if (card.id === 'neutralize' || card.id === 'uppercut' || card.id === 'leg_sweep') enemy.statuses.weak += mgc;
    if (card.id === 'poisonstab' || card.id === 'deadlypoison' || card.id === 'poison_cloud' || card.id === 'poison_smoke') enemy.statuses.poison += mgc;
    if (card.id === 'catalyst') enemy.statuses.poison *= mgc;
  };

  const drawCards = (num, combatState) => {
    for (let i = 0; i < num; i++) {
      if (combatState.drawPile.length === 0) {
        if (combatState.discardPile.length === 0) break;
        combatState.drawPile = shuffle(combatState.discardPile);
        combatState.discardPile = [];
      }
      if (combatState.drawPile.length > 0) {
        combatState.hand.push(combatState.drawPile.pop());
      }
    }
  };

  const checkEnemiesDead = (combatState, playerState) => {
    let anyDead = false;
    combatState.enemies.forEach(e => {
      if (e.hp <= 0 && !e.dead) { 
        e.hp = 0; 
        e.dead = true; 
        if (!e.escaped) {
          addLog(`${e.name}を倒した！`, combatState); 
          if (e.stolenGold > 0) {
             playerState.gold += e.stolenGold;
             addLog(`盗まれた${e.stolenGold}Gを取り返した！`, combatState);
             e.stolenGold = 0;
          }
        }
        anyDead = true;
      }
    });
    return anyDead;
  };

  const endTurn = () => {
    let newCombat = { ...state.combat };
    let newPlayer = { ...state.player };

    let discardCards = [];
    newCombat.hand.forEach(c => {
      const isEthereal = c.upgraded && c.upEthereal !== undefined ? c.upEthereal : c.ethereal;
      if (isEthereal) {
        addLog(`${c.name}はエセリアルのため廃棄された。`, newCombat);
      } else {
        discardCards.push(c);
      }
    });
    newCombat.discardPile = [...newCombat.discardPile, ...discardCards];
    newCombat.hand = [];
    
    if (newCombat.playerStatuses.metallicize > 0) {
      newCombat.playerBlock += newCombat.playerStatuses.metallicize;
      addLog(`金属化でブロックを${newCombat.playerStatuses.metallicize}得た。`, newCombat);
    }
    
    if (newCombat.playerStatuses.combust > 0) {
      newPlayer.hp = Math.max(1, newPlayer.hp - 1);
      newCombat.enemies.forEach(e => {
        if (e.hp > 0) {
          e.hp -= newCombat.playerStatuses.combust;
        }
      });
      addLog(`燃焼でHPを1失い、敵全体に${newCombat.playerStatuses.combust}ダメージ！`, newCombat);
    }

    if (newCombat.playerStatuses.toxicAmplification > 0) {
      let amp = false;
      newCombat.enemies.forEach(e => {
        if (e.hp > 0 && e.statuses.poison > 0) {
          e.statuses.poison += newCombat.playerStatuses.toxicAmplification;
          amp = true;
        }
      });
      if (amp) addLog(`毒の増幅で敵の毒が増加！`, newCombat);
    }

    for (let enemy of newCombat.enemies) {
      if (enemy.hp <= 0) continue;

      if (!enemy.statuses.barricade) {
        enemy.block = 0; 
      }

      if (enemy.statuses.poison > 0) {
        enemy.hp -= enemy.statuses.poison;
        addLog(`${enemy.name}は毒で${enemy.statuses.poison}ダメージを受けた。`, newCombat);
        enemy.statuses.poison--;
        if(enemy.hp <= 0) { enemy.dead = true; continue; }
      }

      if (enemy.statuses.explosion !== undefined) {
          enemy.statuses.explosion--;
          if (enemy.statuses.explosion <= 0) {
              let dmgToTake = 30;
              if (newPlayer.relicStates.blackSwordActive && dmgToTake > 0) {
                  const reduction = Math.min(10, dmgToTake);
                  dmgToTake -= reduction;
                  newPlayer.relicStates.blackSwordActive = false;
                  addLog(`🗡️ 黒い剣が発動！ダメージを${reduction}軽減した！`, newCombat);
              }
              newPlayer.hp -= dmgToTake;
              addLog(`💥 ${enemy.name}が大爆発！ ${dmgToTake}ダメージを受けた！`, newCombat);
              enemy.hp = 0;
              enemy.dead = true;
              continue;
          }
      }

      const intent = enemy.intent;
      
      if (intent.type === 'escape') {
        enemy.hp = 0;
        enemy.dead = true;
        enemy.escaped = true;
        addLog(`${enemy.name}は戦場から逃げ去った！`, newCombat);
        continue; 
      }

      let times = intent.times || 1;

      for(let i=0; i<times; i++) {
        if (intent.type.includes('attack')) {
          let dmg = intent.val + enemy.statuses.strength;
          dmg = Math.max(0, dmg); 
          if (enemy.statuses.weak > 0) dmg = Math.floor(dmg * 0.75); 
          if (newCombat.playerStatuses.vulnerable > 0) dmg = Math.floor(dmg * 1.5);

          let dealt = 0;
          if (newCombat.playerBlock >= dmg) {
            newCombat.playerBlock -= dmg;
          } else {
            dealt = dmg - newCombat.playerBlock;
            if (newPlayer.relicStates.blackSwordActive && dealt > 0) {
                const reduction = Math.min(10, dealt);
                dealt -= reduction;
                newPlayer.relicStates.blackSwordActive = false;
                addLog(`🗡️ 黒い剣が発動！ダメージを${reduction}軽減した！`, newCombat);
            }
            newPlayer.hp -= dealt;
            newCombat.playerBlock = 0;
            
            if (newCombat.playerStatuses.poisonThorns > 0) {
               enemy.statuses.poison += newCombat.playerStatuses.poisonThorns;
               addLog(`蛇の反射により${enemy.name}に毒を${newCombat.playerStatuses.poisonThorns}付与！`, newCombat);
            }
          }
          addLog(`${enemy.name}の攻撃！ ${dmg}ダメージ！`, newCombat);
          
          if (intent.type === 'attack_steal') {
            const stealAmount = Math.min(newPlayer.gold, intent.steal);
            if (stealAmount > 0) {
              newPlayer.gold -= stealAmount;
              enemy.stolenGold += stealAmount;
              addLog(`${enemy.name}に${stealAmount}G奪われた！`, newCombat);
            }
          }

          if (intent.type === 'attack_heal') {
            enemy.hp = Math.min(enemy.maxHp, enemy.hp + intent.heal);
            addLog(`✨ ${enemy.name}が${intent.heal}回復した！`, newCombat);
          }

          if (enemy.statuses.lifesteal && dealt > 0 && enemy.hp > 0) {
            enemy.hp = Math.min(enemy.maxHp, enemy.hp + dealt);
            addLog(`🩸 ${enemy.name}が血を吸い、${dealt}回復した！`, newCombat);
          }
          
          if (newCombat.playerStatuses.caltrops > 0 && enemy.hp > 0) {
            enemy.hp -= newCombat.playerStatuses.caltrops;
            addLog(`まきびしにより${enemy.name}に${newCombat.playerStatuses.caltrops}ダメージ！`, newCombat);
          }
        } 
        
        if (intent.type.includes('defend')) {
          enemy.block += intent.val;
          if (intent.type === 'defend_escape') {
            addLog(`${enemy.name}は防御の構えをとり、逃走の準備をしている。`, newCombat);
          } else {
            addLog(`${enemy.name}は防御の構えをとった。`, newCombat);
          }
        }
        
        if (intent.type.startsWith('buff')) {
          if (intent.type === 'buff_heal') {
              enemy.hp = Math.min(enemy.maxHp, enemy.hp + intent.val);
              addLog(`${enemy.name}が${intent.val}回復した！`, newCombat);
          } else {
              enemy.statuses[intent.stat] += (intent.val || intent.statVal);
          }
        }
        if (intent.type.includes('debuff')) {
          newCombat.playerStatuses[intent.stat] += (intent.val || intent.statVal);
        }
        if (intent.type === 'poison') {
          newCombat.playerStatuses.poison += intent.val;
        }
      }

      enemy.intentIndex = (enemy.intentIndex + 1) % ENEMY_DB[enemy.dbId].intents.length;
      enemy.intent = ENEMY_DB[enemy.dbId].intents[enemy.intentIndex];
      
      if (enemy.statuses.weak > 0) enemy.statuses.weak--;
      if (enemy.statuses.vulnerable > 0) enemy.statuses.vulnerable--;
      if (enemy.statuses.sturdy) enemy.statuses.turnDamage = 0;

      if (enemy.hp > 0 && enemy.statuses.collapse !== undefined) {
          enemy.statuses.collapse--;
          if (enemy.statuses.collapse <= 0) {
              addLog(`〽︎ ${enemy.name}は崩壊した...`, newCombat);
              enemy.hp = 0;
              enemy.dead = true;
          }
      }
    }

    if (newCombat.playerStatuses.poison > 0) {
      newPlayer.hp -= newCombat.playerStatuses.poison;
      addLog(`毒により${newCombat.playerStatuses.poison}ダメージを受けた。`, newCombat);
      newCombat.playerStatuses.poison--;
    }

    if (newPlayer.hp <= 0) {
      setState(p => ({ ...p, screen: 'GAMEOVER', player: newPlayer }));
      return;
    }

    if (!newCombat.playerStatuses.retainBlock && !newCombat.playerStatuses.retainBlockOnce) {
      newCombat.playerBlock = 0;
    }
    newCombat.playerStatuses.retainBlockOnce = false;

    if (newCombat.playerStatuses.nextTurnBlock > 0) {
      newCombat.playerBlock += newCombat.playerStatuses.nextTurnBlock;
      addLog(`前のターンの効果でブロックを${newCombat.playerStatuses.nextTurnBlock}得た。`, newCombat);
      newCombat.playerStatuses.nextTurnBlock = 0;
    }

    let nextEnergy = newPlayer.maxEnergy;
    if (newPlayer.relics.includes('permafrost')) {
      nextEnergy += newCombat.energy;
    }
    newCombat.energy = nextEnergy;
    
    if (newCombat.playerStatuses.cursedBlood > 0) {
      newPlayer.hp = Math.max(1, newPlayer.hp - 1);
      newCombat.energy += newCombat.playerStatuses.cursedBlood;
      addLog(`呪われた血でHPを1失い、エナジーを獲得！`, newCombat);
    }

    if (newPlayer.relics.includes('starClock')) {
      newPlayer.relicStates.starClockTurn += 1;
      if (newPlayer.relicStates.starClockTurn >= 10) {
        newPlayer.relicStates.starClockTurn = 0;
        newCombat.energy += 1;
        addLog('⏳ 星時計が発動！エナジー+1', newCombat);
      }
    }

    if (newPlayer.relics.includes('ironCrest')) {
      newCombat.playerBlock += 3;
      addLog('🛡️ アイアンクレストが発動！ブロック+3', newCombat);
    }
    
    if (newCombat.playerStatuses.demonForm > 0) {
      newCombat.playerStatuses.strength += newCombat.playerStatuses.demonForm;
      addLog(`悪魔化により筋力が${newCombat.playerStatuses.demonForm}上昇！`, newCombat);
    }
    
    if (newCombat.playerStatuses.noxiousFumes > 0) {
      newCombat.enemies.forEach(e => {
        if (e.hp > 0) e.statuses.poison += newCombat.playerStatuses.noxiousFumes;
      });
      addLog(`有毒ガスが敵全体に毒を${newCombat.playerStatuses.noxiousFumes}与えた！`, newCombat);
    }

    if (newCombat.playerStatuses.weak > 0) newCombat.playerStatuses.weak--;
    if (newCombat.playerStatuses.vulnerable > 0) newCombat.playerStatuses.vulnerable--;

    if (newCombat.turn === 10 && newPlayer.relics.includes('stoneCalendar')) {
      newCombat.enemies.forEach(e => {
        if (e.hp > 0) {
          if (e.block >= 35) {
            e.block -= 35;
          } else {
            e.hp -= (35 - e.block);
            e.block = 0;
          }
        }
      });
      addLog('🪨 暦石が発動！敵全体に35ダメージ！', newCombat);
    }
    
    if (newPlayer.relics.includes('fish')) {
      newCombat.enemies.forEach(e => {
        if (e.hp > 0) {
          if (e.block >= 3) {
            e.block -= 3;
          } else {
            e.hp -= (3 - e.block);
            e.block = 0;
          }
        }
      });
      addLog('🐟 う、魚が跳ねて敵全体に3ダメージ！', newCombat);
    }

    newCombat.turn += 1;
    
    if (newCombat.playerStatuses.infiniteBlades > 0) {
      for(let i=0; i<newCombat.playerStatuses.infiniteBlades; i++) {
        newCombat.hand.push({ ...CARD_DB['shiv'], uniqueId: uid(), upgraded: false });
      }
      addLog(`無限の刃によりナイフを${newCombat.playerStatuses.infiniteBlades}枚手札に加えた！`, newCombat);
    }

    drawCards(5, newCombat);

    if (newCombat.playerStatuses.brutality > 0) {
      newPlayer.hp = Math.max(1, newPlayer.hp - 1);
      drawCards(newCombat.playerStatuses.brutality, newCombat);
      addLog(`残虐でHPを1失い、カードを引いた！`, newCombat);
    }

    if (newCombat.hand.some(c => c.id === 'regret')) {
      newCombat.energy = 1;
      addLog('「後悔」によりエナジーが1になった…', newCombat);
    }

    checkEnemiesDead(newCombat, newPlayer);

    if (newCombat.enemies.every(e => e.hp <= 0)) {
      handleVictory(newCombat.enemies[0], newPlayer);
    } else {
      setState(p => ({ ...p, combat: newCombat, player: newPlayer }));
    }
  };

  const handleVictory = (enemyData, finalPlayerState) => {
    // 実績: 初陣
    if (!state.unlocks?.achievements?.includes('first_blood')) {
      unlockData('achievements', ['first_blood']);
    }
    // 実績: エリートキラー
    if (enemyData.isElite && !state.unlocks?.achievements?.includes('elite_killer')) {
      unlockData('achievements', ['elite_killer']);
    }

    const isBoss = enemyData.name.includes('BOSS');
    let goldReward = Math.floor(Math.random() * 20) + 15;
    if (state.player.relics.includes('goldenIdol')) {
      goldReward = Math.floor(goldReward * 1.25);
    }
    const cardRewards = getRandomCards(3, state.player.characterId);
    unlockData('cards', cardRewards.map(c => c.id)); 
    
    let droppedRelic = null;
    if (enemyData.isElite) {
      const availableRelics = Object.keys(RELICS_DB).filter(id => !state.player.relics.includes(id) && id !== 'goldenIdol');
      if (availableRelics.length > 0) {
        droppedRelic = availableRelics[Math.floor(Math.random() * availableRelics.length)];
      }
    }

    setState(p => {
      const currentPlayerState = finalPlayerState || p.player;
      let newHp = currentPlayerState.hp;
      if (isBoss) {
        newHp = Math.min(currentPlayerState.maxHp, newHp + 30);
      }
      return {
        ...p,
        screen: 'REWARD',
        isBossDefeated: isBoss,
        player: { ...currentPlayerState, gold: currentPlayerState.gold + goldReward, hp: newHp },
        rewards: { gold: goldReward, cards: cardRewards, relic: droppedRelic }
      };
    });
  };

  const claimRelic = () => {
    unlockData('relics', [state.rewards.relic]);
    setState(p => {
      let newDeck = [...p.player.deck];
      if (p.rewards.relic === 'blueCage') {
        let skills = newDeck.map((c, i) => ({c, i})).filter(x => x.c.type === 'SKILL' && !x.c.upgraded);
        skills = shuffle(skills);
        const targetCount = Math.min(2, skills.length);
        for(let i=0; i<targetCount; i++) {
          newDeck[skills[i].i] = { ...newDeck[skills[i].i], upgraded: true };
        }
      }
      return {
        ...p,
        player: { ...p.player, deck: newDeck, relics: [...p.player.relics, p.rewards.relic] },
        rewards: { ...p.rewards, relic: null }
      };
    });
  };

  const proceedToNext = (newState) => {
    if (newState.isBossDefeated) {
      if (newState.act === 1) {
        const nextMap = generateMapData();
        return {
          ...newState, screen: 'MAP', act: 2, floor: 1, currentNodeId: null, visitedNodes: [], mapData: nextMap, isBossDefeated: false
        };
      } else {
        if (newState.player.characterId === 'IRONCLAD' && !newState.unlocks?.achievements?.includes('ironclad_victory')) {
          unlockData('achievements', ['ironclad_victory']);
        }
        if (newState.player.characterId === 'POISON' && !newState.unlocks?.achievements?.includes('poison_victory')) {
          unlockData('achievements', ['poison_victory']);
        }
        return { ...newState, screen: 'VICTORY', isBossDefeated: false };
      }
    } else {
      return { ...newState, screen: 'MAP' };
    }
  };

  const claimCard = (card) => {
    unlockData('cards', [card.id]);
    setState(p => {
      let np = { ...p, player: { ...p.player, deck: [...p.player.deck, card] } };
      return proceedToNext(np);
    });
  };

  const skipReward = () => {
    setState(p => {
      let np = { ...p };
      if (p.screen === 'REWARD' && np.player.relics.includes('singingBowl')) {
        np.player.maxHp += 2;
        np.player.hp += 2;
      }
      return proceedToNext(np);
    });
  };

  // --- UI レンダリング関数 ---

  const renderIcon = (type) => {
    switch(type) {
      case 'ATTACK': return '⚔️';
      case 'SKILL': return '🛡️';
      case 'POWER': return '🌀';
      case 'CURSE': return '👻';
      case 'ENERGY': return '⚡';
      case 'HP': return '❤️';
      case 'GOLD': return '💰';
      default: return '📄';
    }
  };

  const getRarityColor = (rarity, isCurse) => {
    if (isCurse) return 'text-purple-400';
    if (rarity === 'RARE') return 'text-yellow-400';
    if (rarity === 'UNCOMMON') return 'text-sky-300';
    if (rarity === 'COMMON') return 'text-slate-100';
    return 'text-slate-400'; 
  };

  const getRelicColor = (rarity) => {
    if (rarity === 'RARE') return 'text-yellow-400';
    if (rarity === 'UNCOMMON') return 'text-sky-300';
    if (rarity === 'EVENT') return 'text-purple-400';
    return 'text-slate-100'; // COMMON
  };

  const getRelicBorderColor = (rarity) => {
    if (rarity === 'RARE') return 'border-yellow-400';
    if (rarity === 'UNCOMMON') return 'border-sky-400';
    if (rarity === 'EVENT') return 'border-purple-400';
    return 'border-slate-400'; // COMMON
  };

  const renderCard = (card, index, isHand = false, isCompendium = false, toggleUpgrade = null) => {
    const isSelected = index === selectedCardIndex;
    const cardCost = card.upgraded && card.costUp !== undefined ? card.costUp : card.cost;
    const isSilencedTurn = state.combat && state.combat.turn % 3 === 0 && state.combat.enemies.some(e => e.statuses.silence_aura && e.hp > 0);
    const canPlay = state.combat && card.type !== 'CURSE' && state.combat.energy >= cardCost && (!state.combat.discardSelectCount || state.combat.discardSelectCount === 0) && !(isSilencedTurn && card.type === 'ATTACK');
    
    let bg = 'bg-slate-700';
    if(card.type === 'ATTACK') bg = 'bg-red-900';
    if(card.type === 'SKILL') bg = 'bg-blue-900';
    if(card.type === 'POWER') bg = 'bg-purple-900';
    if(card.type === 'CURSE') bg = 'bg-slate-900 border-purple-500';

    const isExhaust = card.upgraded && card.upExhaust !== undefined ? card.upExhaust : card.exhaust;

    const baseSizeClasses = isHand 
      ? "w-full max-w-[140px] flex-1 min-w-[45px] h-32 sm:h-40 lg:h-48" 
      : "shrink-0 w-28 h-40 sm:w-32 sm:h-44 lg:w-36 lg:h-48";

    return (
      <div 
        key={card.uniqueId || card.id}
        onClick={() => {
          if (isCompendium && toggleUpgrade && card.type !== 'CURSE') {
            toggleUpgrade(card.id);
            return;
          }
          if (!isHand) return;
          if (!canPlay) return;
          if (card.target === 'ENEMY') {
            setSelectedCardIndex(isSelected ? null : index);
          } else {
            playCard(index);
          }
        }}
        className={`relative rounded-lg border-2 ${baseSizeClasses} ${isSelected ? 'border-yellow-400 -translate-y-4 lg:-translate-y-6 z-10 shadow-[0_0_15px_rgba(234,179,8,0.5)]' : 'border-slate-500'} 
          ${isHand && canPlay ? 'cursor-pointer' : ''}
          ${isHand && !canPlay ? 'opacity-80 cursor-not-allowed' : ''}
          ${isCompendium && card.type !== 'CURSE' ? 'cursor-pointer hover:border-green-400' : ''}
          ${bg} p-1 sm:p-2 flex flex-col shadow-lg transition-all duration-200 overflow-hidden`}
      >
        {isHand && isSilencedTurn && card.type === 'ATTACK' && (
          <div className="absolute inset-0 bg-slate-900/60 flex items-center justify-center z-20 rounded-lg">
              <span className="font-bold text-red-500 text-sm sm:text-lg border-2 border-red-500 p-1 bg-slate-900/80 -rotate-12">沈黙</span>
          </div>
        )}
        <div className={`absolute top-0.5 sm:top-1 left-0.5 sm:left-1 rounded-full w-4 h-4 sm:w-6 sm:h-6 flex items-center justify-center font-bold text-[9px] sm:text-sm ${card.upgraded ? 'bg-green-500 text-white' : 'bg-blue-500'} ${card.type === 'CURSE' ? 'bg-gray-800 text-gray-400' : ''}`}>
          {cardCost}
        </div>
        <div className={`text-center font-bold text-[8px] sm:text-[10px] lg:text-sm mt-3 sm:mt-4 border-b border-slate-500 pb-0.5 sm:pb-1 ${getRarityColor(card.rarity, card.type === 'CURSE')}`}>
          <div className="truncate w-full">{card.name}{card.upgraded ? <span className="text-green-400">+</span> : ''}</div>
        </div>
        <div className="text-[7px] sm:text-[9px] lg:text-xs mt-1 text-slate-200 flex-grow text-center flex flex-col items-center justify-center leading-tight overflow-y-auto [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
          {parseCardText(card)}
          {isExhaust && <span className="text-purple-300 mt-0.5 font-bold">廃棄</span>}
        </div>
        <div className="text-center text-[7px] sm:text-[10px] lg:text-xs font-bold text-slate-400 shrink-0">
          {renderIcon(card.type)} <span className="hidden sm:inline">{card.type}</span>
        </div>
      </div>
    );
  };

  const renderEnemy = (enemy, index) => {
    if (enemy.hp <= 0) return null;
    
    let intentText = '';
    let tooltipText = '';
    const intent = enemy.intent;
    
    if (intent.type.includes('attack')) {
      let displayDmg = intent.val + enemy.statuses.strength;
      displayDmg = Math.max(0, displayDmg); 
      if (enemy.statuses.weak > 0) displayDmg = Math.floor(displayDmg * 0.75);
      if (state.combat && state.combat.playerStatuses.vulnerable > 0) displayDmg = Math.floor(displayDmg * 1.5);
      intentText += `⚔️${displayDmg} `;
      tooltipText += `${displayDmg}ダメージの攻撃\n`;
      if (intent.type === 'attack_steal') {
         tooltipText += `追加効果: ${intent.steal}ゴールド奪う\n`;
      }
      if (intent.type === 'attack_heal') {
         tooltipText += `追加効果: 自身を${intent.heal}回復\n`;
      }
    }
    
    if (intent.type.includes('defend')) {
      if (!intentText.includes('🛡️')) {
        intentText += `🛡️ `;
      }
      tooltipText += `防御(${intent.val}ブロック)\n`;
      if (intent.type === 'defend_escape') {
         intentText += `💨`;
         tooltipText += `逃走の準備\n`;
      }
    }
    if (intent.type.includes('buff') || intent.type.includes('debuff') || intent.type === 'poison') {
      intentText += `🌀 `;
      if (intent.type.includes('buff')) {
        tooltipText += `強化(バフ): `;
        if (intent.stat === 'strength') tooltipText += `筋力上昇\n`;
        else if (intent.type === 'buff_heal') tooltipText += `回復\n`;
        else tooltipText += `ステータス上昇\n`;
      }
      if (intent.type.includes('debuff') || intent.type === 'poison') {
        tooltipText += `妨害(デバフ): `;
        if (intent.stats) {
          let descList = intent.stats.map(s => {
              if (s.stat === 'weak') return `脱力${s.val}`;
              if (s.stat === 'vulnerable') return `弱点${s.val}`;
              return `状態異常${s.val}`;
          });
          tooltipText += descList.join('と') + `を付与\n`;
        } else {
          if (intent.stat === 'strength') tooltipText += `筋力低下\n`;
          else if (intent.stat === 'weak') tooltipText += `脱力を付与\n`;
          else if (intent.stat === 'vulnerable') tooltipText += `弱点を付与\n`;
          else if (intent.type === 'poison') tooltipText += `毒を${intent.val}付与\n`;
          else tooltipText += `状態異常を付与\n`;
        }
      }
    }
    if (intent.times) {
      intentText += `x${intent.times}`;
      tooltipText = tooltipText.trim() + ` (x${intent.times}回)\n`;
    }
    if (intent.type === 'sleep') {
      intentText = '💤';
      tooltipText = '眠っている\n';
    }
    if (intent.type === 'escape') {
      intentText = '💨';
      tooltipText = '逃走する\n';
    }

    const isTargetable = (selectedCardIndex !== null && state.combat.hand[selectedCardIndex].target === 'ENEMY');

    return (
      <div 
        key={enemy.id} 
        className={`flex flex-col items-center p-2 sm:p-3 rounded-lg bg-slate-800 border-2 shrink-0 min-w-[90px] sm:min-w-[120px] max-w-[140px]
          ${isTargetable ? 'border-red-500 cursor-pointer hover:bg-slate-700 animate-pulse' : 'border-transparent'}`}
        onClick={() => {
          if (isTargetable) {
            playCard(selectedCardIndex, index);
          }
        }}
      >
        <div className="relative group flex justify-center w-full">
          <div className="text-yellow-400 font-bold mb-1 text-xs sm:text-base cursor-help px-2">{intentText}</div>
          <div className="absolute bottom-full mb-1 w-max p-2 bg-slate-900 border border-slate-500 rounded text-xs text-white hidden group-hover:block group-active:block shadow-lg z-50 whitespace-pre-wrap text-center">
            {tooltipText.trim()}
          </div>
        </div>
        <div className="text-3xl sm:text-5xl mb-1 sm:mb-2">{enemy.isBoss ? '👹' : enemy.isElite ? '👿' : (enemy.dbId === 'thief' ? '🥷' : '👾')}</div>
        <div className="text-white font-bold text-[10px] sm:text-sm text-center break-words w-full leading-tight">{enemy.name}</div>
        
        {/* HP Bar */}
        <div className="w-full bg-slate-900 rounded-full h-2 sm:h-3 mt-1 sm:mt-2 relative border border-slate-600">
          <div className="bg-red-500 h-full rounded-full" style={{ width: `${(enemy.hp/enemy.maxHp)*100}%` }}></div>
          <div className="absolute inset-0 flex items-center justify-center text-[8px] sm:text-[10px] font-bold text-white leading-none">
            {enemy.hp} / {enemy.maxHp}
          </div>
        </div>
        
        {/* Block & Statuses */}
        <div className="flex flex-wrap justify-center gap-1 sm:gap-2 mt-1 sm:mt-2 text-[9px] sm:text-xs">
          {enemy.block > 0 && (
            <div className="relative group cursor-help">
              <span className="text-blue-300 bg-blue-900/50 px-1 rounded">🛡️{enemy.block}</span>
              <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 w-max p-2 bg-slate-900 border border-slate-500 rounded text-xs text-white hidden group-hover:block z-50 text-center shadow-xl">
                <div className="font-bold text-blue-300 mb-1">ブロック</div>
                <div className="text-[10px] text-slate-300">受けるダメージを数値分軽減する。<br/>ターン終了時に消滅する。</div>
              </div>
            </div>
          )}
          {enemy.statuses.strength !== 0 && (
            <div className="relative group cursor-help">
              <span className={`px-1 rounded ${enemy.statuses.strength > 0 ? 'text-red-400 bg-red-900/50' : 'text-blue-400 bg-blue-900/50'}`}>💪{enemy.statuses.strength}</span>
              <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 w-max p-2 bg-slate-900 border border-slate-500 rounded text-xs text-white hidden group-hover:block z-50 text-center shadow-xl">
                <div className="font-bold text-red-400 mb-1">筋力</div>
                <div className="text-[10px] text-slate-300">アタックによるダメージが<br/>数値分変化する。</div>
              </div>
            </div>
          )}
          {enemy.statuses.weak > 0 && (
            <div className="relative group cursor-help">
              <span className="text-gray-400 bg-gray-800 px-1 rounded">📉{enemy.statuses.weak}</span>
              <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 w-max p-2 bg-slate-900 border border-slate-500 rounded text-xs text-white hidden group-hover:block z-50 text-center shadow-xl">
                <div className="font-bold text-gray-400 mb-1">脱力</div>
                <div className="text-[10px] text-slate-300">アタックで与えるダメージが<br/>25%減少する。<br/>(残り {enemy.statuses.weak} ターン)</div>
              </div>
            </div>
          )}
          {enemy.statuses.vulnerable > 0 && (
